  /* ============================================================
     VORONOI REGION BORDERS — a faint boundary mesh built from the 102
     CITY centroids (d3-delaunay), with the currently-selected region's
     cell highlighted. Purely decorative/navigational — coarse by
     construction (cells derive from city-level centroids, never precise
     coordinates). Fully guarded: if d3/d3.Delaunay didn't load (CDN
     blocked/offline) or `map` is null, this whole block is skipped
     silently and the rest of the app keeps working untouched.
     Default: ON but subtle — thin low-opacity ink stroke, no fill —
     reads as a light boundary mesh rather than a loud overlay; a
     dedicated toggle (#layer-borders) lets users turn it off if 102
     cells feels busy.
     ============================================================ */
  var voronoiLayer = null;       // L.layerGroup of all cell polygons, or null if unavailable
  var voronoiCellsByRegion = {}; // region name -> its L.polygon, for highlight lookups
  var voronoiEnabled = true;     // default ON (see rationale above)

  (function initVoronoi(){
    if (!map) return; // offline / Leaflet failed — nothing to draw on
    if (typeof d3 === 'undefined' || !d3.Delaunay) return; // CDN blocked/offline — skip silently

    try {
      var regionNames = Object.keys(CITY);
      var points = regionNames.map(function(r){ return [CITY[r].lng, CITY[r].lat]; });
      if (points.length < 3) return; // Voronoi needs at least a few points to be meaningful

      var delaunay = d3.Delaunay.from(points);
      var voronoi = delaunay.voronoi([-180, -85, 180, 85]); // world bbox, lat clamped to ±85 so cells stay finite

      var inkColor = getComputedStyle(document.documentElement).getPropertyValue('--pe-ink').trim() || 'currentColor';

      voronoiLayer = L.layerGroup();

      regionNames.forEach(function(region, i){
        var poly = voronoi.cellPolygon(i);
        if (!poly || !poly.length) return; // skip null/empty cells

        // d3 gives [lng,lat] rings; Leaflet wants [lat,lng].
        var latlngs = poly.map(function(pt){ return [pt[1], pt[0]]; });

        var cell = L.polygon(latlngs, {
          color: inkColor, weight: 0.75, opacity: 0.35, dashArray: '3 5',
          fillOpacity: 0,
          interactive: false // default state: never eats marker clicks
        });

        cell._peRegion = region;
        cell._peDefaultStyle = { color: inkColor, weight: 0.75, opacity: 0.35, dashArray: '3 5', fillOpacity: 0 };

        cell.bindTooltip(region, { sticky: true, direction: 'top', opacity: 0.9 });

        voronoiCellsByRegion[region] = cell;
        voronoiLayer.addLayer(cell);
      });

      if (voronoiEnabled) {
        voronoiLayer.addTo(map);
        voronoiLayer.eachLayer(function(cell){ if (cell.bringToBack) cell.bringToBack(); });
      }
    } catch (err) {
      // Any unexpected Voronoi computation failure — fail silent, app keeps working.
      voronoiLayer = null;
      voronoiCellsByRegion = {};
    }
  })();

  var voronoiSafetyColor = getComputedStyle(document.documentElement).getPropertyValue('--pe-safety').trim() || 'currentColor';
  var voronoiSafety18 = getComputedStyle(document.documentElement).getPropertyValue('--pe-safety-18').trim() || 'transparent';
  var voronoiHighlightedRegion = null;

  // Restyle exactly one region's cell as the active/highlighted selection
  // (fill --pe-safety-18, stronger --pe-safety stroke); reset all others to
  // the faint default. Passing null/empty clears every highlight. Safe to
  // call even when the Voronoi layer never initialized (no-op).
  function setVoronoiHighlight(region){
    voronoiHighlightedRegion = region || null;
    Object.keys(voronoiCellsByRegion).forEach(function(r){
      var cell = voronoiCellsByRegion[r];
      if (r === voronoiHighlightedRegion) {
        // fillColor is the resolved --pe-safety-18 token (already an rgba
        // string with its own alpha), so fillOpacity stays at 1 here —
        // Leaflet would otherwise double-apply opacity on top of the rgba.
        cell.setStyle({ color: voronoiSafetyColor, weight: 3, opacity: 1, fillColor: voronoiSafety18, fillOpacity: 1 });
      } else {
        cell.setStyle(cell._peDefaultStyle);
      }
    });
  }

  var bordersBtn = byId('layer-borders');
  function setVoronoiEnabled(on){
    voronoiEnabled = on;
    if (bordersBtn) bordersBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (!voronoiLayer || !map) return; // nothing to toggle if it never initialized
    if (on) {
      voronoiLayer.addTo(map);
      voronoiLayer.eachLayer(function(cell){ if (cell.bringToBack) cell.bringToBack(); });
    } else {
      map.removeLayer(voronoiLayer);
    }
  }
  if (bordersBtn) {
    // Reflect the actual default: if Voronoi never initialized (offline/no d3),
    // the toggle still renders but has nothing to do — leave it pressed=false
    // in that case so it doesn't claim a state that isn't real.
    bordersBtn.setAttribute('aria-pressed', (voronoiEnabled && voronoiLayer) ? 'true' : 'false');
    bordersBtn.addEventListener('click', function(){
      setVoronoiEnabled(!voronoiEnabled);
    });
  }

  /* ============================================================
     SHARED FILTER STATE — one source of truth for search/region/
     looking-for, read by BOTH the directory render and the map
     render. The controls live once in the DOM (above the tabs) and
     drive both views so switching tabs keeps the same filters applied.
     ============================================================ */
  var qEl = byId('q');
  var regionFilterOverride = null; // set by Region browse section

  function directoryMembers(){ return MEMBERS.filter(function(p){ return VIS[p.vis].inDir; }); }

  // Shared predicate: searchable members matching the active search/region/
  // looking-for filters. Both renderDirectory() and renderMapPins() call
  // this so the two views never diverge.
  function filteredMembers(){
    var q = qEl.value.trim().toLowerCase();
    var continent = fContinent.value;
    var region = regionFilterOverride !== null ? regionFilterOverride : fRegion.value;
    var looking = fLooking.value;

    return directoryMembers().filter(function(p){
      if (continent && REGION_CONTINENT[p.region] !== continent) return false;
      if (region && p.region !== region) return false;
      if (looking && p.looking.indexOf(looking) === -1) return false;
      if (q){
        var hay = [p.pn, p.dn, p.region, p.camp, p.role, p.bio]
          .concat(p.skills, p.interests, p.projects, p.looking).join(' ').toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  // Camp filter bar (Feature 3) — search (name + hometown/region) and
  // "has a site" checkbox. Shared by the camp LIST and the camp MAP layer
  // so the two stay in sync (see filteredCamps() below).
  var campQEl = byId('camp-q');
  var campHasSiteEl = byId('camp-has-site');
  function filteredCamps(){
    var q = campQEl.value.trim().toLowerCase();
    var hasSiteOnly = campHasSiteEl.checked;
    return CAMPS.filter(function(c){
      if (hasSiteOnly && !c.url) return false;
      if (q){
        var hay = (c.name + ' ' + c.region).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  // Map layer mode — Burners (default, preserves prior behavior) / Camps /
  // Both. Separate arrays per layer so toggling one never wipes the other.
  var mapMode = 'burners';
  var mapCircles = []; // burner dots
  var mapCampMarkers = []; // camp squares
  var mapCountEl = byId('map-count');

  function renderBurnerPins(){
    if (!map) return;
    // Read the one accent from the design tokens — never hardcode the color.
    var accent = getComputedStyle(document.documentElement).getPropertyValue('--pe-safety').trim() || 'currentColor';
    mapCircles.forEach(function(c){ map.removeLayer(c); });
    mapCircles = [];
    var list = filteredMembers(); // already restricted to onMap via directoryMembers()/inDir === onMap for both states
    list.forEach(function(p){
      if (!p._live && !CITY[p.region]) return;
      // Coarse city-level coords (member's own city/zip if set, else the
      // region centroid) plus deterministic coarse jitter — see
      // resolveMemberCoords(). Fixed-pixel dot (circleMarker) so pins stay
      // visible at every zoom — a metric 5km circle vanishes below a pixel
      // at world zoom. No precise/street-level coordinate is ever stored.
      var coords = resolveMemberCoords(p);
      var circle = L.circleMarker([coords.lat, coords.lng], {
        radius:5, color:accent, weight:2, fillColor:accent, fillOpacity:0.6
      }).addTo(map);
      mapCircles.push(circle);
      var popHTML =
        '<div class="pop">' +
          '<div class="pop-head">' + avatarHTML(p,'sm') +
            '<div><div class="pop-name">' + esc(p.pn) + '</div>' +
            '<div class="pop-sub">' + esc(p.region) + (p.camp ? ' · ' + esc(p.camp) : ' · No camp') + '</div></div></div>' +
          '<div class="pop-bio">' + esc(p.bio) + '</div>' +
          '<button class="btn btn-sm pop-btn" data-open="' + esc(p.pn) + '">' + esc(S.viewProfile) + '</button>' +
        '</div>';
      circle.bindPopup(popHTML);
    });
    return list.length;
  }

  // Camp markers — small ink SQUARES (L.divIcon), a distinct SHAPE from the
  // round burner dot, using only palette tokens (ink fill / bone edge).
  // Coarse city-centroid + deterministic jitter only — see
  // resolveCampCoords(); camps with no placeable hometown are simply
  // skipped here (they still show in the list).
  function renderCampPins(){
    if (!map) return 0;
    mapCampMarkers.forEach(function(m){ map.removeLayer(m); });
    mapCampMarkers = [];
    var list = filteredCamps();
    var shown = 0;
    var campIcon = L.divIcon({ className: 'camp-pin-wrap', html: '<div class="camp-pin"></div>', iconSize: [10,10] });
    list.forEach(function(c){
      var coords = resolveCampCoords(c);
      if (!coords) return; // unplaceable hometown — list-only, never guessed onto the map
      shown++;
      var marker = L.marker([coords.lat, coords.lng], { icon: campIcon }).addTo(map);
      mapCampMarkers.push(marker);
      var popHTML =
        '<div class="pop">' +
          '<span class="pop-camp-tag">' + esc(S.campsOrgStamp) + '</span>' +
          '<div class="pop-name">' + esc(c.name) + '</div>' +
          '<div class="pop-sub">' + esc(c.region) + '</div>' +
          (c.url ? '<div class="pop-bio"><a href="' + esc(c.url) + '" target="_blank" rel="noopener">Visit site ↗</a></div>' : '') +
          '<button class="btn btn-sm pop-btn" data-open-camp="' + esc(c.name) + '">' + esc(S.viewCampDetails) + '</button>' +
        '</div>';
      marker.bindPopup(popHTML);
    });
    return shown;
  }

  function renderMapPins(){
    if (!map) return;
    var showBurners = mapMode === 'burners' || mapMode === 'both';
    var showCamps = mapMode === 'camps' || mapMode === 'both';

    var burnerCount = 0, campCount = 0;
    if (showBurners) { burnerCount = renderBurnerPins(); }
    else { mapCircles.forEach(function(c){ map.removeLayer(c); }); mapCircles = []; }

    if (showCamps) { campCount = renderCampPins(); }
    else { mapCampMarkers.forEach(function(m){ map.removeLayer(m); }); mapCampMarkers = []; }

    if (mapCountEl){
      var parts = [];
      if (showBurners) parts.push(burnerCount + ' ' + S.mapCountBurners);
      if (showCamps) parts.push(campCount + ' ' + S.mapCountCamps);
      mapCountEl.textContent = parts.join(' · ');
    }
  }
  renderMapPins();

  if (map) map.on('popupopen', function(e){
    var btn = e.popup.getElement().querySelector('[data-open]');
    if (btn) btn.addEventListener('click', function(){ openProfile(btn.getAttribute('data-open')); });
    var campBtn = e.popup.getElement().querySelector('[data-open-camp]');
    if (campBtn) campBtn.addEventListener('click', function(){ openCampDetail(campBtn.getAttribute('data-open-camp')); });
  });

  /* ============================================================
     MAP LAYER TOGGLE — Burners / Camps / Both segmented buttons.
     Default = Burners (preserves prior behavior). Re-renders map
     layers immediately on switch.
     ============================================================ */
  var layerBtns = {
    burners: byId('layer-burners'),
    camps: byId('layer-camps'),
    both: byId('layer-both')
  };
  function setMapMode(mode){
    mapMode = mode;
    Object.keys(layerBtns).forEach(function(k){
      layerBtns[k].setAttribute('aria-pressed', k === mode ? 'true' : 'false');
    });
    renderMapPins();
  }
  layerBtns.burners.addEventListener('click', function(){ setMapMode('burners'); });
  layerBtns.camps.addEventListener('click', function(){ setMapMode('camps'); });
  layerBtns.both.addEventListener('click', function(){ setMapMode('both'); });

  // Camp search / has-a-site filter drives BOTH the camp list and (when
  // visible) the camp map layer, so list and map camp layer stay in sync.
  [campQEl, campHasSiteEl].forEach(function(el){
    el.addEventListener(el.type === 'checkbox' ? 'change' : 'input', function(){
      renderCampList(campList, null);
      if (map && (mapMode === 'camps' || mapMode === 'both')) renderMapPins();
    });
  });

  /* ============================================================
     DIRECTORY
     ============================================================ */
  var grid = byId('grid');
  var dirCount = byId('dir-count');

  function renderDirectory(){
    var list = filteredMembers();

    dirCount.textContent = list.length + ' / ' + directoryMembers().length + ' visible members';
    grid.innerHTML = '';
    if (!list.length){
      grid.innerHTML = '<div class="empty">No members match your filters. Try widening your search.</div>';
      return;
    }
    list.forEach(function(p){
      var card = document.createElement('button');
      card.className = 'card';
      card.type = 'button';
      card.setAttribute('aria-label', 'Open profile for ' + p.pn);
      card.innerHTML =
        '<div class="card-head">' + avatarHTML(p) +
          '<div style="flex:1;min-width:0;">' +
            '<div class="card-name">' + esc(p.pn) + ' <span class="card-pronouns">' + esc(p.pronouns) + '</span></div>' +
            '<div class="card-region">' + esc(p.region) + (p.camp ? ' · ' + esc(p.camp) : ' · No camp') + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="card-bio">' + esc(p.bio) + '</div>' +
        tagList(p.skills.slice(0,3));
      card.addEventListener('click', function(){ openProfile(p.pn); });
      grid.appendChild(card);
    });
  }
  [qEl, fRegion, fLooking].forEach(function(el){
    el.addEventListener('input', function(){
      regionFilterOverride = null;
      // #f-region itself changed (dropdown pick or cleared to "All regions") —
      // sync the Voronoi highlight to match; q/looking-for don't touch region.
      if (el === fRegion) setVoronoiHighlight(fRegion.value || null);
      renderDirectory();
      if (map) renderMapPins();
    });
  });
  renderDirectory();

  /* ============================================================
     TABS (Map / Directory)
     ============================================================ */
  var tabMap = byId('tab-map');
  var tabDir = byId('tab-dir');
  var viewMap = byId('view-map');
  var viewDir = byId('view-dir');
  function selectTab(which){
    var isMap = which === 'map';
    tabMap.setAttribute('aria-selected', isMap);
    tabDir.setAttribute('aria-selected', !isMap);
    viewMap.hidden = !isMap;
    viewDir.hidden = isMap;
    if (isMap && map) setTimeout(function(){ map.invalidateSize(); }, 60);
  }
  tabMap.addEventListener('click', function(){ selectTab('map'); });
  tabDir.addEventListener('click', function(){ selectTab('dir'); });
  selectTab('map');

  /* ============================================================
     VISIBILITY EXPLAINER — two states only (Private / Searchable).
     This CE fork deliberately collapses the core Playa.Earth 5-tier
     model into a binary one; see VIS above.
     ============================================================ */
  var legend = byId('legend');
  function renderLegend(){
    legend.innerHTML = '';
    VIS_ORDER.forEach(function(k){
      var m = VIS[k];
      var count = MEMBERS.filter(function(p){ return p.vis === k; }).length;
      var div = document.createElement('div');
      div.className = 'legend-item';
      div.innerHTML =
        '<div class="top">' + visBadgeHTML(k) + '<span class="cnt">' + count + ' demo</span></div>' +
        '<p>' + esc(m.desc) + '</p>' +
        '<p class="form-hint" style="margin-top:6px;">On map: ' + (m.onMap ? 'Yes (coarse)' : 'No') + ' · In directory: ' + (m.inDir ? 'Yes' : 'No') + '</p>';
      legend.appendChild(div);
    });
  }
  renderLegend();

  /* ============================================================
     CAMP DISCOVERY (read-only, org data only)
     ============================================================ */
  var campList = byId('camp-list');
  // filterRegion (Region Browse) and the camp search/has-a-site filter bar
  // (Feature 3, filteredCamps()) compose: the main Camp Discovery list has
  // no region filter, the Region Browse list adds one on top of the same
  // search/has-a-site state so the two controls never fight each other.
  function renderCampList(target, filterRegion){
    var list = filteredCamps().filter(function(c){
      if (!filterRegion) return true;
      return c.region.toLowerCase().indexOf(filterRegion.split(' ')[0].toLowerCase()) !== -1 ||
             filterRegion.toLowerCase().indexOf(c.region.toLowerCase()) !== -1;
    });
    target.innerHTML = '';
    if (!list.length){
      target.innerHTML = '<div class="empty">' + esc(S.regionsNoCamps) + '</div>';
      return;
    }
    list.forEach(function(c){
      var div = document.createElement('div');
      div.className = 'camp-card';
      div.setAttribute('tabindex', '0');
      div.setAttribute('role', 'button');
      div.setAttribute('aria-label', S.viewCampDetails + ': ' + c.name);
      div.innerHTML =
        '<h4>' + esc(c.name) + '</h4>' +
        '<div class="cr">' + esc(c.region) + '</div>' +
        (c.url ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">Visit site ↗</a>' : '<span class="form-hint">No public link on file</span>');
      // Card itself opens the camp detail modal; the "Visit site" link inside
      // it still navigates externally without also popping the modal.
      div.addEventListener('click', function(e){
        if (e.target.tagName === 'A') return;
        openCampDetail(c.name);
      });
      div.addEventListener('keydown', function(e){
        if ((e.key === 'Enter' || e.key === ' ') && e.target === div){
          e.preventDefault();
          openCampDetail(c.name);
        }
      });
      target.appendChild(div);
    });
  }
  renderCampList(campList, null);

  /* ============================================================
     REGION BROWSE
     ============================================================ */
  var regionListEl = byId('region-list');
  var regionFilteredOut = byId('region-filtered-out');
  var regionMemberGrid = byId('region-member-grid');
  var regionCampGrid = byId('region-camp-grid');
  var regionMembersHeading = byId('region-members-heading');
  var regionCampsHeading = byId('region-camps-heading');
  var regionClearBtn = byId('region-clear-btn');
  var activeRegionChip = null;

  // Region chips are grouped under a per-continent .mono-label subheading —
  // at ~100 regions a flat chip wall is unusable, and grouping also keeps
  // the chips in the same continent order used by the filter bar's region
  // select. Still one flat set of .region-chip buttons for the zine-tilt
  // pass and click→filter behavior; only the visual grouping is new.
  CONTINENTS_WITH_REGIONS.forEach(function(continent){
    var group = document.createElement('div');
    group.className = 'region-continent-group';

    var heading = document.createElement('div');
    heading.className = 'mono-label region-continent-label';
    heading.textContent = continent;
    group.appendChild(heading);

    var row = document.createElement('div');
    row.className = 'region-chip-row';
    regionsForContinent(continent).forEach(function(r){
      var chip = document.createElement('button');
      chip.className = 'region-chip';
      chip.type = 'button';
      chip.setAttribute('aria-pressed', 'false');
      chip.textContent = r;
      chip.addEventListener('click', function(){
        selectRegion(r, chip);
      });
      row.appendChild(chip);
    });
    group.appendChild(row);

    regionListEl.appendChild(group);
  });

  function selectRegion(region, chipEl){
    if (activeRegionChip) activeRegionChip.setAttribute('aria-pressed', 'false');
    activeRegionChip = chipEl;
    chipEl.setAttribute('aria-pressed', 'true');
    regionFilteredOut.style.display = 'block';
    regionMembersHeading.textContent = S.regionsMembersHeading + ' ' + region;
    regionCampsHeading.textContent = S.regionsCampsHeading + ' ' + region;

    var members = directoryMembers().filter(function(p){ return p.region === region; });
    regionMemberGrid.innerHTML = '';
    if (!members.length){
      regionMemberGrid.innerHTML = '<div class="empty">' + esc(S.regionsNoMembers) + '</div>';
    } else {
      members.forEach(function(p){
        var card = document.createElement('button');
        card.className = 'card';
        card.type = 'button';
        card.innerHTML =
          '<div class="card-head">' + avatarHTML(p) +
            '<div style="flex:1;min-width:0;">' +
              '<div class="card-name">' + esc(p.pn) + '</div>' +
              '<div class="card-region">' + esc(p.region) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="card-bio">' + esc(p.bio) + '</div>';
        card.addEventListener('click', function(){ openProfile(p.pn); });
        regionMemberGrid.appendChild(card);
      });
    }
    renderCampList(regionCampGrid, region);

    // also sync main directory filter for continuity — updates both the
    // directory grid AND the map pins, since they share one filter state.
    // The continent select is synced first (and the region select's
    // options repopulated for that continent) so #f-region always offers
    // the clicked region as a valid option before we set its value.
    var continent = REGION_CONTINENT[region] || '';
    fContinent.value = continent;
    refreshSelect(fContinent);
    populateRegionOptions(fRegion, continent);
    fRegion.value = REGION_NAMES.indexOf(region) !== -1 ? region : '';
    refreshSelect(fRegion);
    regionFilterOverride = region;
    setVoronoiHighlight(region);
    renderDirectory();
    if (map) renderMapPins();
  }

  regionClearBtn.addEventListener('click', function(){
    if (activeRegionChip) activeRegionChip.setAttribute('aria-pressed', 'false');
    activeRegionChip = null;
    regionFilteredOut.style.display = 'none';
    regionFilterOverride = null;
    setVoronoiHighlight(null);
    fRegion.value = '';
    syncTriggerLabel(fRegion);
    renderDirectory();
    if (map) renderMapPins();
  });

  /* ============================================================
     PROFILE MODAL — exactly 20 fields + block/report
     ============================================================ */
  var backdrop = byId('modal-backdrop');
  var modalHeader = byId('modal-header');
  var modalBody = byId('modal-body');
  var modalClose = byId('modal-close');
  var lastFocused = null;

  function field(label, val){
    return '<div class="prof-field"><div class="flabel">' + esc(label) + '</div><div class="fval">' + val + '</div></div>';
  }
  function fieldFull(label, val){
    return '<div class="prof-field full"><div class="flabel">' + esc(label) + '</div><div class="fval">' + val + '</div></div>';
  }

  function verifiedBadgeHTML(state){
    if (state === 'verified') return '<span class="verified"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg> Verified</span>';
    if (state === 'flagged') return '<span class="verified flagged">Flagged — under review</span>';
    return '<span class="verified">Unverified</span>';
  }

  function openProfile(pn){
    var p = MEMBERS.filter(function(x){ return x.pn === pn; })[0];
    if (!p) return;
    lastFocused = document.activeElement;

    modalHeader.innerHTML =
      '<div class="modal-id">' + avatarHTML(p,'lg') +
        '<div class="meta">' +
          '<h3 id="modal-title">' + esc(p.pn) + '</h3>' +
          '<div class="mp">' + esc(p.pronouns) + (p.dn ? ' · Default-world: ' + esc(p.dn) : ' · Default-world name: not shared') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="modal-badges">' + verifiedBadgeHTML(p.verified) +
        '<span class="vbadge on-ink">' + esc(p.region) + '</span>' +
      '</div>';

    // 20 fields, in the exact order from CLAUDE.md
    modalBody.innerHTML =
      '<div class="field-grid">' +
        field('1. Playa name', esc(p.pn)) +
        field('2. Default-world name (optional)', p.dn ? esc(p.dn) : '<em>Not shared</em>') +
        field('3. Pronouns', esc(p.pronouns)) +
        field('4. Avatar', avatarHTML(p,'sm')) +
        field('5. Home region', esc(p.region)) +
        field('6. Approximate location', (p.city ? esc(p.city) + ' · ' : '') + '<span class="geohash">' + esc(p.geo || (CITY[p.region] && CITY[p.region].geo) || '——————') + '</span> <span class="form-hint">(city-level, never precise)</span>') +
        fieldFull('7. Bio', esc(p.bio)) +
        field('8. Years burning', esc(p.years)) +
        field('9. Burns attended', esc(p.burns)) +
        field('10. Camp affiliation', p.camp ? esc(p.camp) : '<em>No camp — full member</em>') +
        field('11. Camp role', p.role ? esc(p.role) : '<em>N/A — no camp</em>') +
        fieldFull('12. Skills / offerings', tagList(p.skills)) +
        fieldFull('13. Interests', tagList(p.interests)) +
        fieldFull('14. Art / projects', tagList(p.projects)) +
        fieldFull('15. Looking for', tagList(p.looking)) +
        field('16. Languages', esc(p.langs.join(', '))) +
        field('17. Hosting / travel availability', esc(p.avail)) +
        fieldFull('18. Regional events attended', tagList(p.regional)) +
        field('19. Contact preference', esc(p.contact)) +
        field('20. Verification status', verifiedBadgeHTML(p.verified)) +
      '</div>';

    // Live member actions — only when signed in and viewing someone else.
    if (p._id && ME.user && ME.profile && ME.profile.id !== p._id) {
      modalBody.innerHTML +=
        '<div class="modal-actions">' +
          '<button class="btn btn-sm" id="ma-msg">Message</button>' +
          '<button class="btn btn-sm btn-outline" id="ma-verify">Ask to vouch for me</button>' +
          '<button class="btn btn-sm btn-outline" id="ma-block">Block</button>' +
          '<button class="btn btn-sm btn-outline" id="ma-report">Report</button>' +
        '</div>' +
        '<div id="ma-compose" style="display:none;margin-top:var(--pe-space-3);">' +
          '<textarea id="ma-body" style="width:100%;min-height:72px;" placeholder="Write a short intro…"></textarea>' +
          '<button class="btn btn-sm" id="ma-send" style="margin-top:var(--pe-space-2);">Send</button>' +
        '</div>' +
        '<div id="ma-status" class="form-hint" style="margin-top:var(--pe-space-2);min-height:1.2em;"></div>';
      var maStatus = byId('ma-status');
      var maPost = async function(url, payload){
        try {
          var r = await fetch(url, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          return { ok: r.ok, j: await r.json().catch(function(){ return {}; }) };
        } catch (e) { return { ok: false, j: { error: 'network error' } }; }
      };
      byId('ma-msg').addEventListener('click', function(){ var c = byId('ma-compose'); c.style.display = c.style.display === 'none' ? 'block' : 'none'; });
      byId('ma-send').addEventListener('click', async function(){
        var b = byId('ma-body').value.trim();
        if (!b) { maStatus.textContent = 'Write a message first.'; return; }
        var r = await maPost('/api/messages', { toId: p._id, body: b });
        maStatus.textContent = r.ok ? 'Message sent.' : (r.j.error || 'Could not send.');
        if (r.ok) { byId('ma-body').value = ''; byId('ma-compose').style.display = 'none'; }
      });
      byId('ma-verify').addEventListener('click', async function(){
        var r = await maPost('/api/verify/request', { voucherId: p._id });
        maStatus.textContent = r.ok ? ('Verification request sent to ' + p.pn + '.') : (r.j.error || 'Could not send request.');
      });
      byId('ma-block').addEventListener('click', async function(){
        var r = await maPost('/api/block', { targetId: p._id });
        maStatus.textContent = r.ok ? 'Blocked — they can no longer find or message you.' : (r.j.error || 'Could not block.');
      });
      byId('ma-report').addEventListener('click', async function(){
        var reason = window.prompt('Report reason (optional):') || '';
        var r = await maPost('/api/report', { targetId: p._id, reason: reason });
        maStatus.textContent = r.ok ? 'Reported for review.' : (r.j.error || 'Could not report.');
      });
    }

    backdrop.classList.add('show');
    document.body.style.overflow = 'hidden';
    modalClose.focus();
  }
  function closeModal(){
    backdrop.classList.remove('show');
    document.body.style.overflow = '';
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }
  modalClose.addEventListener('click', closeModal);
  backdrop.addEventListener('click', function(e){ if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && backdrop.classList.contains('show')) closeModal();
  });

  /* ============================================================
     CAMP DETAIL MODAL — read-only, sanctioned org data only:
     name, hometown/region, public description blurb (from the
     official Burning Man Innovate archive), and external link.
     Never shows contact_email/gps/exact_location/images/etc —
     those fields are never even read out of CAMPS (which itself
     only ever carries name/region/url/desc). Camps are
     organizations, not people, so this reuses the member profile
     modal's shell (bone bg, ink borders, zero radius, offset
     shadow) but has its own field set and its own backdrop/close
     wiring, parallel to (not shared with) the member modal.
     ============================================================ */
  var campBackdrop = byId('camp-modal-backdrop');
  var campModalHeader = byId('camp-modal-header');
  var campModalBody = byId('camp-modal-body');
  var campModalClose = byId('camp-modal-close');
  var campLastFocused = null;

  function openCampDetail(campName){
    var c = CAMPS.filter(function(x){ return x.name === campName; })[0];
    if (!c) return;
    campLastFocused = document.activeElement;

    campModalHeader.innerHTML =
      '<div class="modal-id">' +
        '<div class="meta">' +
          '<h3 id="camp-modal-title">' + esc(c.name) + '</h3>' +
        '</div>' +
      '</div>' +
      '<div class="modal-badges">' +
        '<span class="vbadge on-ink">' + esc(c.region) + '</span>' +
      '</div>';

    var descHTML = (c.desc && c.desc.length)
      ? esc(c.desc)
      : '<em>' + esc(S.campModalNoDesc) + '</em>';

    var linkHTML = c.url
      ? '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(S.campModalViewLink) + '</a>'
      : '<span class="form-hint">' + esc(S.campModalNoLink) + '</span>';

    campModalBody.innerHTML =
      '<span class="pe-stamp org-stamp">' + esc(S.campModalRegistryTag) + '</span>' +
      '<div class="field-grid">' +
        fieldFull(S.campModalRegionLabel, esc(c.region)) +
        fieldFull(S.campModalDescLabel, descHTML) +
        fieldFull(S.campModalLinkLabel, linkHTML) +
      '</div>';

    campBackdrop.classList.add('show');
    document.body.style.overflow = 'hidden';
    campModalClose.focus();
  }
  function closeCampModal(){
    campBackdrop.classList.remove('show');
    document.body.style.overflow = '';
    if (campLastFocused && campLastFocused.focus) campLastFocused.focus();
  }
  campModalClose.addEventListener('click', closeCampModal);
  campBackdrop.addEventListener('click', function(e){ if (e.target === campBackdrop) closeCampModal(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && campBackdrop.classList.contains('show')) closeCampModal();
  });

  /* ============================================================
     ONBOARDING FLOW — age gate, 20 fields, visibility (default
     Private), coarse location only, confirm (no persistence)
     ============================================================ */
  var onbBackdrop = byId('onb-backdrop');
  var onbClose = byId('onb-close');
  var onbSteps = byId('onb-steps');
  var onbState = { step:1, dobOk:false, chosenTier:'ghost', region:'', city:'' };
  var STEP_LABELS = [S.onbStep1, S.onbStep2, S.onbStep3, S.onbStep4, S.onbStep5];

  function renderOnbSteps(){
    onbSteps.innerHTML = STEP_LABELS.map(function(label, i){
      var n = i+1;
      var cls = n === onbState.step ? 'active' : (n < onbState.step ? 'done' : '');
      return '<div class="onb-step ' + cls + '">' + (n) + '. ' + esc(label) + '</div>';
    }).join('');
  }

  function goToStep(n){
    onbState.step = n;
    document.querySelectorAll('.onb-panel').forEach(function(p){ p.classList.remove('active'); });
    byId('onb-panel-' + n).classList.add('active');
    // Step 0 (sign-in) sits outside the numbered 1–5 flow, so hide the tracker.
    onbSteps.style.display = (n >= 1 && n <= 5) ? '' : 'none';
    if (n >= 1 && n <= 5) renderOnbSteps();
  }

  function openOnboarding(){
    lastFocused = document.activeElement;
    onbState = { step:1, dobOk:false, chosenTier:'ghost', region:'', city:'' };
    byId('onb-dob').value = '';
    byId('age-gate-error').style.display = 'none';
    buildFieldsForm();
    buildTierChoice();
    onbLocRegion.value = '';
    syncTriggerLabel(onbLocRegion);
    byId('onb-loc-city').value = '';
    // The onboarding fields form (Step 2) rebuilds its <select> elements
    // (home region, contact preference) fresh every time the modal opens —
    // enhance them now so they get the same custom dropdown treatment as
    // the filter bar. enhanceSelect() is idempotent, so this is also safe
    // to call again on subsequent opens.
    enhanceAllSelects(byId('onb-fields-form'));
    // Branch on auth state: signed out -> sign-in step; already a member ->
    // a short "you're in" confirmation; signed in without a profile -> the
    // full profile flow starting at the age gate.
    if (!ME.user) {
      byId('onb-auth-status').textContent = '';
      byId('onb-email').value = '';
      goToStep(0);
    } else if (ME.profile) {
      setText('onb-confirm-title', "You're signed in.");
      byId('onb-confirm-body').textContent = 'You already have a profile as ' + (ME.profile.pn || 'a member') +
        ' (' + (ME.profile.visibility === 'searchable' ? 'Searchable' : 'Private') + ').';
      byId('onb-confirm-summary').textContent = '';
      goToStep(5);
    } else {
      goToStep(1);
    }
    onbBackdrop.classList.add('show');
    document.body.style.overflow = 'hidden';
    onbClose.focus();
  }
  function closeOnboarding(){
    onbBackdrop.classList.remove('show');
    document.body.style.overflow = '';
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }
  byId('btn-join-nav').addEventListener('click', openOnboarding);
  byId('btn-join-hero').addEventListener('click', openOnboarding);
  onbClose.addEventListener('click', closeOnboarding);
  onbBackdrop.addEventListener('click', function(e){ if (e.target === onbBackdrop) closeOnboarding(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && onbBackdrop.classList.contains('show')) closeOnboarding();
  });
  byId('onb-confirm-close').addEventListener('click', function(){
    closeOnboarding();
    // A freshly created profile needs a reload so state/discovery reflect it.
    if (onbState.created) location.reload();
  });

  /* ---- Step 1: age gate (hard-enforced, not a checkbox) ---- */
  byId('age-gate-submit').addEventListener('click', function(){
    var val = byId('onb-dob').value;
    var errEl = byId('age-gate-error');
    if (!val){
      errEl.textContent = 'Enter your date of birth to continue.';
      errEl.style.display = 'block';
      return;
    }
    var dob = new Date(val + 'T00:00:00');
    var today = new Date();
    var age = today.getFullYear() - dob.getFullYear();
    var m = today.getMonth() - dob.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;

    if (age < 18){
      errEl.textContent = S.ageGateBlocked;
      errEl.style.display = 'block';
      // Hard stop: no path forward, no bypass. Disable submit.
      byId('age-gate-submit').disabled = true;
      byId('onb-dob').disabled = true;
      return;
    }
    errEl.style.display = 'none';
    onbState.dobOk = true;
    goToStep(2);
  });

  /* ---- Step 2: 20 fields (excluding avatar upload / verification, which
     are system-assigned or derived; every editable field maps 1:1) ---- */
  function buildFieldsForm(){
    var host = byId('onb-fields-form');
    host.innerHTML =
      '<div class="form-row">' +
        f('onb-f-pn', '1. Playa name', 'text', true) +
        f('onb-f-dn', '2. Default-world name (optional)', 'text', false) +
      '</div>' +
      '<div class="form-row">' +
        f('onb-f-pronouns', '3. Pronouns', 'text', true) +
        f('onb-f-avatar', '4. Avatar (emoji or initials)', 'text', true) +
      '</div>' +
      '<div class="form-row">' +
        selectField('onb-f-region2', '5. Home region', REGION_NAMES, true) +
        '<div class="form-field"><label>6. Approximate location</label><div class="form-hint">Derived automatically from your home region + city in the next step — always city-level, never precise.</div></div>' +
      '</div>' +
      '<div class="form-row">' +
        '<div class="form-field full"><label for="onb-f-bio">7. Bio</label><textarea id="onb-f-bio"></textarea></div>' +
      '</div>' +
      '<div class="form-row">' +
        f('onb-f-years', '8. Years burning', 'text', true) +
        f('onb-f-burns', '9. Burns attended', 'text', true) +
      '</div>' +
      '<div class="form-row">' +
        f('onb-f-camp', '10. Camp affiliation (optional — no camp required)', 'text', false) +
        f('onb-f-role', '11. Camp role (optional)', 'text', false) +
      '</div>' +
      '<div class="form-row">' +
        f('onb-f-skills', '12. Skills / offerings (comma-separated)', 'text', true) +
        f('onb-f-interests', '13. Interests (comma-separated)', 'text', true) +
      '</div>' +
      '<div class="form-row">' +
        f('onb-f-projects', '14. Art / projects (comma-separated)', 'text', false) +
        f('onb-f-looking', '15. Looking for (rides, camp, collaborators, friends)', 'text', true) +
      '</div>' +
      '<div class="form-row">' +
        f('onb-f-langs', '16. Languages (comma-separated)', 'text', true) +
        f('onb-f-avail', '17. Hosting / travel availability', 'text', false) +
      '</div>' +
      '<div class="form-row">' +
        f('onb-f-regional', '18. Regional events attended (comma-separated)', 'text', false) +
        selectField('onb-f-contact', '19. Contact preference', ['In-app message','Email after intro'], true) +
      '</div>' +
      '<div class="form-row">' +
        '<div class="form-field full"><label>20. Verification status</label><div class="form-hint">Set automatically to <strong>Unverified</strong> at signup. Moves to Verified or Flagged only through review — never a numeric score.</div></div>' +
      '</div>';

    function f(id, label, type, required){
      return '<div class="form-field"><label for="'+id+'">'+esc(label)+(required?' <span style="color:var(--pe-safety);">*</span>':' <span class="form-hint">('+esc(S.optionalMark)+')</span>')+'</label><input type="'+type+'" id="'+id+'" /></div>';
    }
    function selectField(id, label, options, required){
      var opts = '<option value="">— select —</option>' + options.map(function(o){ return '<option value="'+esc(o)+'">'+esc(o)+'</option>'; }).join('');
      return '<div class="form-field"><label for="'+id+'">'+esc(label)+(required?' <span style="color:var(--pe-safety);">*</span>':'')+'</label><select id="'+id+'">'+opts+'</select></div>';
    }
  }
  byId('onb-back-2').addEventListener('click', function(){ goToStep(1); });
  byId('onb-next-2').addEventListener('click', function(){ goToStep(3); });

  /* ---- Step 3: visibility, default pre-selected = Private (least
     exposure by default — user must actively choose Searchable) ---- */
  function buildTierChoice(){
    var host = byId('onb-tier-choice');
    host.innerHTML = VIS_ORDER.map(function(k){
      var m = VIS[k];
      var checked = k === onbState.chosenTier ? 'checked' : '';
      return '<label class="tier-opt' + (k===onbState.chosenTier?' selected':'') + '" data-tier="'+k+'">' +
        '<input type="radio" name="onb-tier" value="'+k+'" ' + checked + ' /> <strong>' + esc(m.label) + (k==='ghost' ? ' (default)' : '') + '</strong>' +
        '<div class="form-hint" style="margin-top:4px;">' + esc(m.desc) + '</div>' +
      '</label>';
    }).join('');
    host.querySelectorAll('.tier-opt').forEach(function(opt){
      opt.addEventListener('click', function(){
        onbState.chosenTier = opt.getAttribute('data-tier');
        host.querySelectorAll('.tier-opt').forEach(function(o){ o.classList.remove('selected'); });
        opt.classList.add('selected');
        opt.querySelector('input').checked = true;
      });
    });
  }
  byId('onb-back-3').addEventListener('click', function(){ goToStep(2); });
  byId('onb-next-3').addEventListener('click', function(){ goToStep(4); });

  /* ---- Step 4: coarse location only — city/ZIP is an OPTIONAL input
     that is immediately coarsened to a city-level point; no street
     address or GPS field exists, and a raw ZIP is never displayed. ---- */
  setText('onb-geo-lockout', S.onbGeoLockout);
  byId('onb-next-4').addEventListener('click', async function(){
    var region = onbLocRegion.value;
    var cityOrZip = byId('onb-loc-city').value.trim();
    onbState.region = region;
    onbState.city = cityOrZip;

    // Resolve the free-text entry to a city-level label only — city name
    // if it matches the region's table, else treated as a zip lookup,
    // else fall back to the region centroid. The raw entry itself is
    // never shown in the summary if it doesn't resolve to a known city.
    var cityOptions = (region && CITY_TABLE[region]) || [];
    var resolvedLabel = null;
    if (cityOrZip) {
      var matchByCity = cityOptions.filter(function (c) { return c.city.toLowerCase().indexOf(cityOrZip.toLowerCase()) === 0; })[0];
      if (matchByCity) {
        resolvedLabel = matchByCity.city;
      } else if (ZIP_TO_CITY[cityOrZip]) {
        resolvedLabel = ZIP_TO_CITY[cityOrZip].city;
      }
    }
    var geo = region && CITY[region] ? CITY[region].geo : '——————';
    var approx = resolvedLabel ? (resolvedLabel + ' (' + geo + ')') : (geo + ' (city-level)');
    var summary = 'Playa name: ' + (byId('onb-f-pn').value || '(not set)') +
      ' · Home region: ' + (region || '(not set)') +
      ' · Approx. location: ' + approx +
      ' · Visibility: ' + VIS[onbState.chosenTier].label +
      ' · Verification: Unverified (pending review)';
    setText('onb-confirm-summary', summary);
    if (LIVE) {
      var errEl = byId('onb-submit-error');
      errEl.style.display = 'none';
      var ok = await submitProfile(errEl);
      if (!ok) return; // stay on step 4 with the error shown
    }
    goToStep(5);
  });
  byId('onb-back-4').addEventListener('click', function(){ goToStep(3); });

  /* ---- Real signup wiring (LIVE): magic-link sign-in + profile create ---- */
  byId('onb-send-link').addEventListener('click', async function(){
    var email = byId('onb-email').value.trim();
    var status = byId('onb-auth-status');
    if (!email) { status.textContent = 'Enter your email to continue.'; return; }
    status.textContent = 'Sending…';
    try {
      var res = await fetch('/api/auth/request', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email }),
      });
      var j = await res.json();
      if (!res.ok) { status.textContent = j.error || 'Something went wrong — try again.'; return; }
      status.innerHTML = 'Check your email for a sign-in link.' + (j.devLink ? ' <a href="' + esc(j.devLink) + '">[dev link]</a>' : '');
    } catch (e) { status.textContent = 'Network error — try again.'; }
  });

  async function submitProfile(errEl){
    function fail(msg){ if (errEl){ errEl.textContent = msg; errEl.style.display = 'block'; } return false; }
    var body = {
      dob: byId('onb-dob').value,
      pn: byId('onb-f-pn').value, dn: byId('onb-f-dn').value,
      pronouns: byId('onb-f-pronouns').value, avatar: byId('onb-f-avatar').value,
      bio: byId('onb-f-bio').value, years: byId('onb-f-years').value, burns: byId('onb-f-burns').value,
      camp: byId('onb-f-camp').value, role: byId('onb-f-role').value,
      skills: byId('onb-f-skills').value, interests: byId('onb-f-interests').value,
      projects: byId('onb-f-projects').value, looking: byId('onb-f-looking').value,
      langs: byId('onb-f-langs').value, regional: byId('onb-f-regional').value,
      avail: byId('onb-f-avail').value,
      contactPref: byId('onb-f-contact').value === 'Email after intro' ? 'email_after_intro' : 'in_app',
      region: onbState.region || byId('onb-f-region2').value, homeCity: onbState.city || '',
    };
    var res, j;
    try {
      res = await fetch('/api/profile', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      j = await res.json();
    } catch (e) { return fail('Network error — please try again.'); }
    if (res.status === 401) return fail('Your sign-in link expired. Close this and request a new one.');
    if (!res.ok) return fail(j && j.error ? j.error : 'Could not save your profile.');

    if (onbState.chosenTier === 'beacon') {
      try {
        await fetch('/api/profile/visibility', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ visibility: 'searchable' }),
        });
      } catch (e) { /* stays Private if this fails — safe default */ }
    }
    ME.profile = j.profile; onbState.created = true;
    var vis = onbState.chosenTier === 'beacon' ? 'Searchable' : 'Private';
    setText('onb-confirm-title', "You're in.");
    byId('onb-confirm-body').textContent = 'Your Playa.Earth account is live at ' + vis + ' visibility. ' +
      (vis === 'Private'
        ? 'You can explore freely; no one can find you until you switch to Searchable.'
        : 'Other members can now find you at coarse (~5km) resolution.');
    return true;
  }

  // Reflect signed-in state in the Join buttons.
  if (ME.user) {
    var joinLbl = ME.profile ? "You're in" : 'Finish signup';
    setText('btn-join-nav', joinLbl); setText('btn-join-hero', joinLbl);
  }

  // Returning from a magic link (?onboard=1) with no profile yet -> jump
  // straight into the profile flow.
  if (/[?&]onboard=1\b/.test(location.search) && ME.user && !ME.profile) {
    openOnboarding();
  }

  /* ============================================================
     "PREVIEW AS TIER" — nice-to-have global preview, wires into
     legend highlight above; also usable from anywhere via hash.
     ============================================================ */

  /* ============================================================
     ZINE TILT — deterministic per-element rotation ("gritty but
     deliberate, not jittery"). Ported from kitchen-sink.html.

     The reference seeds one PRNG and walks a static DOM. This page
     re-renders the directory / map popups / modal / onboarding, so
     instead each element seeds its OWN PRNG from its text — the same
     element always gets the same tilt regardless of DOM order — and a
     MutationObserver re-applies to freshly rendered nodes. Ranges match
     the reference: small stamped accents tilt most, wide labels least.
     Segmented runs (nav, tabs, form cells) carry no matching class, so
     they stay square and shared borders keep meeting; :disabled lies
     flat because .pe-disabled's transform:none wins.
     ============================================================ */
  (function(){
    function seededDeg(key, min, max){
      var s = 137;
      for (var i = 0; i < key.length; i++){ s = (Math.imul(s ^ key.charCodeAt(i), 0x6D2B79F5) + 0x6D2B79F5) | 0; }
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      var r = ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      return (min + r * (max - min)).toFixed(2) + 'deg';
    }
    var GROUPS = [
      { sel: '.tag, .vbadge, .vnum',       min: -5, max: 5, salt: 'a' },
      { sel: '.pe-stamp',                  min: -6, max: 4, salt: 's' },
      { sel: '.btn, .wordmark',            min: -3, max: 3, salt: 'b' },
      { sel: '.section-head .mono-label',  min: -1, max: 1, salt: 'l' },
      { sel: '.card',                      min: -2, max: 2, salt: 'c' },
      { sel: '.camp-card',                 min: -2, max: 2, salt: 'k' },
      { sel: '.val',                       min: -2, max: 2, salt: 'v' },
      { sel: '.region-chip',               min: -3, max: 3, salt: 'r' }
    ];
    function apply(){
      GROUPS.forEach(function(g){
        document.querySelectorAll(g.sel).forEach(function(el){
          el.style.setProperty('--tilt', seededDeg(g.salt + '|' + (el.textContent || '').trim(), g.min, g.max));
        });
      });
    }
    apply();
    // Re-apply to dynamically rendered nodes. childList only (not attributes),
    // so our own --tilt writes can't retrigger it. Coalesced with a microtask
    // (falls back to a 0ms timer) so it fires reliably even when the tab isn't
    // painting — rAF gets throttled in background tabs.
    var pending = false;
    function schedule(){
      if (pending) return;
      pending = true;
      var run = function(){ pending = false; apply(); };
      if (window.queueMicrotask) window.queueMicrotask(run); else window.setTimeout(run, 0);
    }
    new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
  })();

})();
</script>
</body>
