<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Playa.Earth · Find your Burner world.</title>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
  integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=="
  crossorigin="anonymous"
  referrerpolicy="no-referrer"
/>
<style>
/* ============================================================
   PLAYA.EARTH — DESIGN TOKENS  (inlined verbatim from
   playa-earth-tokens.css — do not hardcode values elsewhere)
   ============================================================ */
:root {
  --pe-bone:        #efe9db;
  --pe-ink:         #141210;
  --pe-safety:      #ff5714;
  --pe-white:       #ffffff;

  --pe-ink-50:      rgba(20,18,16,.5);
  --pe-ink-13:      rgba(20,18,16,.13);
  --pe-ink-05:      rgba(20,18,16,.05);
  --pe-safety-18:   rgba(255,87,20,.18);

  --pe-bg:          var(--pe-bone);
  --pe-fg:          var(--pe-ink);
  --pe-action:      var(--pe-safety);
  --pe-alert:       var(--pe-safety);

  --pe-font:        'Courier New', ui-monospace, Menlo, monospace;

  --pe-text-stamp:  10px;
  --pe-text-micro:  11px;
  --pe-text-xs:     12px;
  --pe-text-sm:     13px;
  --pe-text-base:   14px;
  --pe-text-md:     15px;
  --pe-text-lg:     20px;
  --pe-text-xl:     22px;
  --pe-text-2xl:    24px;
  --pe-display-fluid: clamp(40px, 7vw, 80px);
  --pe-h2-fluid:      clamp(26px, 4vw, 44px);

  --pe-weight:      700;

  --pe-leading-tight:  .98;
  --pe-leading-flat:   1;
  --pe-leading-body:   1.5;
  --pe-leading-copy:   1.6;

  --pe-track-display: -.02em;
  --pe-track-tight:   .04em;
  --pe-track-wide:    .14em;
  --pe-track-wider:   .18em;
  --pe-track-widest:  .2em;

  --pe-space-1:  4px;
  --pe-space-2:  8px;
  --pe-space-3:  12px;
  --pe-space-4:  16px;
  --pe-space-5:  22px;
  --pe-space-6:  30px;
  --pe-space-7:  44px;
  --pe-space-8:  64px;

  --pe-radius:      0;
  --pe-border-2:    2px solid var(--pe-ink);
  --pe-border-3:    3px solid var(--pe-ink);
  --pe-border-2w:   2px;
  --pe-border-3w:   3px;
  --pe-divider:     2px dashed var(--pe-ink);
  --pe-divider-3:   3px dashed var(--pe-ink);

  --pe-shadow-block:      4px 4px 0 var(--pe-ink);
  --pe-shadow-block-in:   1px 1px 0 var(--pe-ink);
  --pe-shadow-tag:        3px 3px 0 var(--pe-safety);

  --pe-dur-0:       0ms;
  --pe-dur-snap:    60ms;
  --pe-ease:        steps(1, end);

  --pe-focus-width: 3px;
  --pe-focus:       3px solid var(--pe-safety);
  --pe-focus-offset: 2px;

  /* Stamp defaults — used as the --tilt fallback so stamps read correctly
     even before the zine-tilt JS runs. Live tilt is set per element via
     --tilt (seeded, deterministic) — see the "Zine tilt" script. */
  --pe-rot-stamp:   -3deg;
  --pe-rot-stamp-alt: 2deg;
}

/* ---- UTILITY CLASSES (inlined from playa-earth-tokens.css) ---- */
.pe-stamp {
  display: inline-block;
  border: 2px solid var(--pe-safety);
  color: var(--pe-safety);
  padding: 3px 8px;
  font: var(--pe-weight) var(--pe-text-stamp)/1 var(--pe-font);
  letter-spacing: var(--pe-track-widest);
  text-transform: uppercase;
  transform: rotate(var(--tilt, var(--pe-rot-stamp)));
}
.pe-stamp--alt { transform: rotate(var(--tilt, var(--pe-rot-stamp-alt))); }
.pe-stamp--inverse { color: var(--pe-white); border-color: var(--pe-white); }

/* Zine tilt — randomized static rotation, set per element as --tilt by JS.
   Only free-standing stamped items tilt; segmented runs (tabs, nav links,
   form cells) stay square so shared borders keep meeting. Disabled items
   lie flat (transform:none in .pe-disabled wins). */
.btn, .tag, .vbadge, .vnum, .wordmark, .section-head .mono-label {
  transform: rotate(var(--tilt, 0deg));
}

.pe-block {
  border: var(--pe-border-2);
  box-shadow: var(--pe-shadow-block);
  transition: box-shadow var(--pe-dur-snap) var(--pe-ease),
              transform var(--pe-dur-snap) var(--pe-ease);
}
.pe-block:hover {
  box-shadow: var(--pe-shadow-block-in);
  transform: translate(3px, 3px) rotate(var(--tilt, 0deg));
}
.pe-block:active {
  box-shadow: 0 0 0 var(--pe-ink);
  transform: translate(4px, 4px) rotate(var(--tilt, 0deg));
}

.pe-focus:focus-visible,
:where(a, button, input, select, [tabindex]):focus-visible {
  outline: var(--pe-focus);
  outline-offset: var(--pe-focus-offset);
}

.pe-disabled,
:disabled {
  border-style: dashed !important;
  color: var(--pe-ink-50) !important;
  box-shadow: none !important;
  cursor: not-allowed;
  transform: none !important;
}

.pe-error {
  border-color: var(--pe-safety) !important;
  border-width: var(--pe-border-3w) !important;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  /* tilt is static posture, not motion — keep it; only drop the hover shift */
  .pe-block:hover, .pe-block:active,
  .btn:hover, .btn:active { transform: rotate(var(--tilt, 0deg)); box-shadow: var(--pe-shadow-block); }
}

/* ============================================================
   PLAYA.EARTH — PAGE STYLES (brutalist, tokens-only, zero radius,
   one accent = --pe-safety for action/alert only)
   ============================================================ */
*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
body{
  margin:0;
  background:var(--pe-bg);
  color:var(--pe-fg);
  font-family:var(--pe-font);
  font-size:var(--pe-text-md);
  line-height:var(--pe-leading-body);
  background-image:radial-gradient(var(--pe-ink-05) 1px, transparent 1px);
  background-size:5px 5px;
}
h1,h2,h3,h4{ margin:0 0 var(--pe-space-2); line-height:var(--pe-leading-flat); text-transform:uppercase; }
p{ margin:0 0 var(--pe-space-3); }
a{ color:inherit; }
button{ font-family:inherit; cursor:pointer; }
.wrap{ max-width:1160px; margin:0 auto; padding:0 var(--pe-space-4); }
.mono-label{ font-size:var(--pe-text-micro); letter-spacing:var(--pe-track-wider); text-transform:uppercase; font-weight:var(--pe-weight); }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0; }

/* buttons */
.btn{
  font-family:inherit; font-weight:var(--pe-weight); font-size:var(--pe-text-sm);
  letter-spacing:var(--pe-track-wide); text-transform:uppercase;
  background:var(--pe-safety); color:var(--pe-white); border:var(--pe-border-2);
  box-shadow:var(--pe-shadow-block); padding:var(--pe-space-3) var(--pe-space-4);
  transition: box-shadow var(--pe-dur-snap) var(--pe-ease), transform var(--pe-dur-snap) var(--pe-ease);
}
.btn:hover{ box-shadow:var(--pe-shadow-block-in); transform:translate(3px,3px) rotate(var(--tilt,0deg)); }
.btn:active{ box-shadow:0 0 0 var(--pe-ink); transform:translate(4px,4px) rotate(var(--tilt,0deg)); }
.btn-outline{ background:var(--pe-bg); color:var(--pe-fg); }
.btn-ink{ background:var(--pe-ink); color:var(--pe-bone); }
.btn-sm{ font-size:var(--pe-text-xs); padding:var(--pe-space-2) var(--pe-space-3); }
.btn[disabled]{ background:var(--pe-bg); }

/* header/nav */
header.site{ border-bottom:var(--pe-border-3); background:var(--pe-bg); position:sticky; top:0; z-index:900; }
.nav{ display:flex; align-items:center; justify-content:space-between; padding:var(--pe-space-4); flex-wrap:wrap; gap:var(--pe-space-3); max-width:1160px; margin:0 auto; }
.wordmark{ font-weight:var(--pe-weight); font-size:var(--pe-text-xl); letter-spacing:var(--pe-track-tight); text-transform:uppercase; border:var(--pe-border-3); padding:var(--pe-space-2) var(--pe-space-3); background:var(--pe-ink); color:var(--pe-bone); display:flex; align-items:center; gap:var(--pe-space-2); }
.navlinks{ display:flex; flex-wrap:wrap; gap:0; }
.navlinks button, .navlinks a{ background:none; padding:var(--pe-space-2) var(--pe-space-3); border:var(--pe-border-2); border-right-width:0; font-size:var(--pe-text-xs); letter-spacing:var(--pe-track-wide); text-transform:uppercase; font-weight:var(--pe-weight); color:var(--pe-fg); }
.navlinks button:last-child, .navlinks a:last-child{ border-right-width:2px; }
.navlinks button:hover, .navlinks a:hover{ background:var(--pe-safety); color:var(--pe-white); }
.navlinks button[aria-current="true"]{ background:var(--pe-ink); color:var(--pe-bone); }

/* hero */
.hero{ border-bottom:var(--pe-border-3); }
.hero-inner{ max-width:1160px; margin:0 auto; display:grid; grid-template-columns:1.3fr 1fr; }
.hero-l{ padding:var(--pe-space-7) var(--pe-space-4); border-right:var(--pe-divider-3); }
.hero-r{ padding:var(--pe-space-7) var(--pe-space-5); display:flex; flex-direction:column; justify-content:center; gap:var(--pe-space-4); }
.hero-tags{ display:flex; gap:var(--pe-space-3); margin-bottom:var(--pe-space-5); flex-wrap:wrap; }
.display{ font-weight:var(--pe-weight); font-size:var(--pe-display-fluid); line-height:var(--pe-leading-tight); letter-spacing:var(--pe-track-display); text-transform:uppercase; }
.display .hi{ color:var(--pe-safety); background:var(--pe-ink); padding:0 var(--pe-space-1); }
.hero-sub{ font-size:var(--pe-text-md); line-height:var(--pe-leading-copy); border-left:3px solid var(--pe-safety); padding-left:var(--pe-space-4); }
.hero-actions{ display:flex; gap:var(--pe-space-3); flex-wrap:wrap; margin-top:var(--pe-space-4); }
.privacy-box{ border:var(--pe-border-2); padding:var(--pe-space-4); }
.privacy-box ul{ margin:var(--pe-space-2) 0 0; padding-left:var(--pe-space-4); }
.privacy-box li{ font-size:var(--pe-text-base); margin-bottom:var(--pe-space-1); }

/* value props — separate tilted cards */
.vals{ border-bottom:var(--pe-border-3); padding:var(--pe-space-6) var(--pe-space-5); }
.vals-grid{ max-width:1160px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:var(--pe-space-5); }
.val{ padding:var(--pe-space-6) var(--pe-space-5); border:var(--pe-border-3); box-shadow:var(--pe-shadow-block); background:var(--pe-bone); transform: rotate(var(--tilt, 0deg)); }
.val .vnum{ font-size:var(--pe-text-micro); font-weight:var(--pe-weight); letter-spacing:var(--pe-track-widest); border:var(--pe-border-2); display:inline-block; padding:2px 7px; margin-bottom:var(--pe-space-4); }
.val h3{ font-size:var(--pe-text-lg); letter-spacing:var(--pe-track-tight); margin-bottom:var(--pe-space-2); }
.val p{ font-size:var(--pe-text-base); margin:0; }

/* donate strip */
.donate-strip{ border-bottom:var(--pe-border-3); background:var(--pe-ink); color:var(--pe-bone); padding:var(--pe-space-5) 0; }
.donate-inner{ max-width:1160px; margin:0 auto; padding:0 var(--pe-space-4); display:flex; justify-content:space-between; align-items:center; gap:var(--pe-space-4); flex-wrap:wrap; }
.donate-inner p{ margin:0; font-size:var(--pe-text-base); max-width:640px; }
.donate-inner strong{ color:var(--pe-safety); }

/* sections */
.section{ padding:var(--pe-space-7) 0; border-bottom:var(--pe-border-3); }
.section-head{ max-width:720px; margin-bottom:var(--pe-space-5); }
.section-head .mono-label{ display:block; margin-bottom:var(--pe-space-2); color:var(--pe-safety); }
.section-head h2{ font-size:var(--pe-h2-fluid); letter-spacing:var(--pe-track-tight); }
.section-head p{ font-size:var(--pe-text-md); }

/* tabs */
.tabs{ display:inline-flex; border:var(--pe-border-2); margin-bottom:var(--pe-space-4); }
.tab{ background:var(--pe-bg); border:0; border-right:var(--pe-border-2); color:var(--pe-fg); font-weight:var(--pe-weight); padding:var(--pe-space-2) var(--pe-space-5); font-size:var(--pe-text-xs); letter-spacing:var(--pe-track-wide); text-transform:uppercase; }
.tab:last-child{ border-right:0; }
.tab[aria-selected="true"]{ background:var(--pe-ink); color:var(--pe-bone); }
.tab:hover:not([aria-selected="true"]){ background:var(--pe-safety-18); }

.demo-banner{
  display:flex; align-items:center; gap:var(--pe-space-3);
  border:var(--pe-border-2); border-left:6px solid var(--pe-safety);
  padding:var(--pe-space-3) var(--pe-space-4); font-size:var(--pe-text-sm);
  margin-bottom:var(--pe-space-4);
}
.demo-banner strong{ color:var(--pe-safety); }

/* map */
#map{ height:520px; border:var(--pe-border-3); z-index:1; }
.leaflet-container{ background:var(--pe-bone); font-family:var(--pe-font); }

/* map layer toggle — segmented run, same square/mono/uppercase language
   as .tab; stays flat (no zine tilt) like other segmented controls. */
.layer-toggle{ display:inline-flex; border:var(--pe-border-2); margin-bottom:var(--pe-space-3); }
.layer-btn{ background:var(--pe-bg); border:0; border-right:var(--pe-border-2); color:var(--pe-fg); font-weight:var(--pe-weight); padding:var(--pe-space-2) var(--pe-space-4); font-size:var(--pe-text-xs); letter-spacing:var(--pe-track-wide); text-transform:uppercase; }
.layer-btn:last-child{ border-right:0; }
.layer-btn[aria-pressed="true"]{ background:var(--pe-ink); color:var(--pe-bone); }
.layer-btn:hover:not([aria-pressed="true"]){ background:var(--pe-safety-18); }

/* Voronoi region-border toggle — standalone (not part of the Burners/Camps/
   Both layer-mode group), same square/mono token language as .layer-btn. */
.borders-toggle{ border:var(--pe-border-2); margin:0 0 var(--pe-space-3) var(--pe-space-2); vertical-align:top; }

/* camp map marker — ink square (divIcon), distinct SHAPE from the round
   burner dot; palette-only (ink fill, bone gap), zero radius. */
.camp-pin{ width:10px; height:10px; background:var(--pe-ink); border:1px solid var(--pe-bone); box-sizing:border-box; }
.pop-camp-tag{ display:inline-block; font-size:var(--pe-text-stamp); font-weight:var(--pe-weight); letter-spacing:var(--pe-track-wide); text-transform:uppercase; color:var(--pe-ink-50); margin-bottom:var(--pe-space-1); }
.leaflet-popup-content-wrapper{ background:var(--pe-bone); color:var(--pe-fg); border:var(--pe-border-2); box-shadow:var(--pe-shadow-block); border-radius:0; }
.leaflet-popup-tip{ background:var(--pe-bone); border:var(--pe-border-2); box-shadow:none; }
.leaflet-popup-content{ margin:var(--pe-space-3) var(--pe-space-4); }
.leaflet-control-attribution{ background:var(--pe-bone) !important; color:var(--pe-ink-50) !important; font-family:var(--pe-font) !important; }
.leaflet-bar{ border:var(--pe-border-2) !important; border-radius:0 !important; }
.leaflet-bar a{ background:var(--pe-bone) !important; color:var(--pe-fg) !important; border-radius:0 !important; border-bottom:2px solid var(--pe-ink) !important; }
.leaflet-bar a:hover{ background:var(--pe-safety-18) !important; }

.pop{ min-width:220px; }
.pop-head{ display:flex; align-items:center; gap:var(--pe-space-3); margin-bottom:var(--pe-space-2); }
.pop-name{ font-weight:var(--pe-weight); font-size:var(--pe-text-base); text-transform:uppercase; }
.pop-sub{ font-size:var(--pe-text-xs); color:var(--pe-ink-50); }
.pop-bio{ font-size:var(--pe-text-sm); margin:var(--pe-space-2) 0; }
.pop-btn{ width:100%; }

.avatar{ width:40px; height:40px; flex:none; display:grid; place-items:center; font-weight:var(--pe-weight); font-size:var(--pe-text-lg); background:var(--pe-bone); border:var(--pe-border-2); color:var(--pe-fg); }
.avatar.sm{ width:34px; height:34px; font-size:var(--pe-text-base); }
.avatar.lg{ width:64px; height:64px; font-size:26px; }

/* directory */
.dir-controls{ display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:0; border:var(--pe-border-2); margin-bottom:var(--pe-space-4); }
.field{ border-right:2px solid var(--pe-ink); }
.field:last-child{ border-right:0; }
.field label{ display:block; background:var(--pe-safety); color:var(--pe-white); padding:4px var(--pe-space-3); font-size:var(--pe-text-stamp); letter-spacing:var(--pe-track-wider); text-transform:uppercase; font-weight:var(--pe-weight); border-bottom:2px solid var(--pe-ink); }
input[type="text"], input[type="email"], input[type="date"], select{
  width:100%; font-family:var(--pe-font); font-size:var(--pe-text-base); background-color:var(--pe-bone); color:var(--pe-fg);
  border:0; padding:var(--pe-space-3); outline:none; border-radius:0;
}
/* Selects: strip native chrome (required for custom styling to show) so they
   match the brutalist inputs; caret drawn with tokens via currentColor (=--pe-fg). */
select{
  cursor:pointer;
  -webkit-appearance:none; -moz-appearance:none; appearance:none;
  letter-spacing:var(--pe-track-tight);
  padding-right:var(--pe-space-7);
  background-image:
    linear-gradient(45deg, transparent 50%, currentColor 50%),
    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%;
  background-size: 6px 6px, 6px 6px;
  background-repeat: no-repeat;
}
select::-ms-expand{ display:none; }

/* ---- Custom select enhancement (enhanceSelect / enhanceAllSelects) ----
   The native <select> stays in the DOM as the source of truth (hidden via
   .pe-select-native), and a token-styled trigger + listbox panel render on
   top. Kept deliberately parallel to the native `select{...}` rules above
   so the trigger looks identical to the control it replaces in both the
   filter bar (.field) and the onboarding form (.form-field). */
.pe-select-wrap{ position:relative; width:100%; }
.pe-select-native.pe-select-hidden{
  position:absolute; opacity:0; pointer-events:none; width:1px; height:1px; margin:-1px; overflow:hidden;
}
.pe-select-trigger{
  display:flex; align-items:center; justify-content:space-between; gap:var(--pe-space-2);
  width:100%; font-family:var(--pe-font); font-size:var(--pe-text-base); letter-spacing:var(--pe-track-tight);
  background-color:var(--pe-bone); color:var(--pe-fg);
  border:0; padding:var(--pe-space-3); border-radius:0; cursor:pointer; text-align:left;
}
.field .pe-select-trigger{ border:0; }
.form-field .pe-select-trigger{ border:var(--pe-border-2); padding:var(--pe-space-2) var(--pe-space-3); }
.pe-select-trigger .pe-caret{
  flex:none; width:0; height:0; margin-left:var(--pe-space-2);
  border-left:5px solid transparent; border-right:5px solid transparent; border-top:6px solid currentColor;
}
.pe-select-trigger[aria-expanded="true"] .pe-caret{
  border-top:none; border-bottom:6px solid currentColor;
}
.pe-select-trigger .pe-trigger-label{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pe-select-panel{
  position:absolute; top:100%; left:0; right:0; margin-top:2px;
  background:var(--pe-bone); border:var(--pe-border-3); box-shadow:var(--pe-shadow-block);
  z-index:1000; max-height:300px; overflow-y:auto; border-radius:0;
  display:none;
}
.pe-select-panel.open{ display:block; }
.pe-select-option{
  font-family:var(--pe-font); font-size:var(--pe-text-base); text-transform:uppercase;
  letter-spacing:var(--pe-track-tight); color:var(--pe-fg); background:var(--pe-bone);
  padding:var(--pe-space-2) var(--pe-space-3); cursor:pointer; border-bottom:1px solid var(--pe-ink-13);
}
.pe-select-option:last-child{ border-bottom:0; }
.pe-select-option.pe-option-active{ background:var(--pe-safety-18); }
.pe-select-option.pe-option-selected{ background:var(--pe-ink); color:var(--pe-bone); }
.pe-select-option.pe-option-selected.pe-option-active{ background:var(--pe-ink); color:var(--pe-bone); }

.dir-count{ font-size:var(--pe-text-sm); color:var(--pe-ink-50); margin-bottom:var(--pe-space-4); text-transform:uppercase; letter-spacing:var(--pe-track-tight); }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); grid-auto-rows:min-content; align-content:start; align-items:start; gap:var(--pe-space-4); height:520px; overflow-y:auto; overflow-x:hidden; border:var(--pe-border-2); padding:var(--pe-space-4); }
.card{
  background:var(--pe-bone); border:var(--pe-border-2); box-shadow:var(--pe-shadow-block);
  padding:var(--pe-space-4); cursor:pointer; text-align:left; color:inherit; width:100%;
  transition: box-shadow var(--pe-dur-snap) var(--pe-ease), transform var(--pe-dur-snap) var(--pe-ease);
  transform: rotate(var(--tilt, 0deg));
}
.card:hover{ box-shadow:var(--pe-shadow-block-in); transform:translate(3px,3px) rotate(var(--tilt,0deg)); }
.card-head{ display:flex; align-items:center; gap:var(--pe-space-3); margin-bottom:var(--pe-space-3); }
.card-name{ font-weight:var(--pe-weight); text-transform:uppercase; }
.card-pronouns{ font-size:var(--pe-text-stamp); color:var(--pe-ink-50); text-transform:none; }
.card-region{ font-size:var(--pe-text-xs); color:var(--pe-ink-50); }
.card-bio{ font-size:var(--pe-text-sm); margin:var(--pe-space-2) 0 var(--pe-space-3); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.tags{ display:flex; flex-wrap:wrap; gap:var(--pe-space-2); margin-top:var(--pe-space-2); }
.tag{ border:var(--pe-border-2); padding:3px 8px; font-size:var(--pe-text-stamp); text-transform:uppercase; letter-spacing:var(--pe-track-tight); font-weight:var(--pe-weight); box-shadow:var(--pe-shadow-tag); }
.empty{ color:var(--pe-ink-50); padding:var(--pe-space-8) var(--pe-space-4); text-align:center; grid-column:1/-1; border:var(--pe-divider); }

/* visibility badges */
.vbadge{ display:inline-flex; align-items:center; gap:5px; font-size:var(--pe-text-stamp); font-weight:var(--pe-weight); padding:3px 9px; letter-spacing:var(--pe-track-wider); text-transform:uppercase; border:var(--pe-border-2); white-space:nowrap; }
.vbadge.on-ink{ border-color:var(--pe-bone); color:var(--pe-bone); }
.vbadge.vbeacon{ background:var(--pe-safety); color:var(--pe-white); border-color:var(--pe-ink); }
.vdot{ width:6px; height:6px; background:currentColor; display:inline-block; }

/* legend */
.legend{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:0; border:var(--pe-border-2); }
.legend-item{ border-right:2px solid var(--pe-ink); border-bottom:2px solid var(--pe-ink); padding:var(--pe-space-4); }
.legend-item .top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--pe-space-2); gap:var(--pe-space-2); }
.legend-item .cnt{ font-size:var(--pe-text-stamp); color:var(--pe-ink-50); font-weight:var(--pe-weight); }
.legend-item p{ font-size:var(--pe-text-sm); margin:0; }
.legend-item.active{ background:var(--pe-safety-18); }

/* camp discovery / region browse */
.camp-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:var(--pe-space-3); }
/* Main camp-discovery list is long (~170 camps) — same fixed scroll box as the directory. */
#camp-list{ grid-auto-rows:min-content; align-content:start; align-items:start; height:520px; overflow-y:auto; overflow-x:hidden; border:var(--pe-border-2); padding:var(--pe-space-4); }
.camp-card{
  border:var(--pe-border-2); padding:var(--pe-space-3); transform: rotate(var(--tilt, 0deg));
  cursor:pointer; box-shadow:var(--pe-shadow-block);
  transition: box-shadow var(--pe-dur-snap) var(--pe-ease), transform var(--pe-dur-snap) var(--pe-ease);
}
.camp-card:hover{ box-shadow:var(--pe-shadow-block-in); transform:translate(3px,3px) rotate(var(--tilt,0deg)); }
.camp-card h4{ font-size:var(--pe-text-base); margin-bottom:var(--pe-space-1); }
.camp-card .cr{ font-size:var(--pe-text-xs); color:var(--pe-ink-50); margin-bottom:var(--pe-space-2); }
.camp-card a{ font-size:var(--pe-text-xs); color:var(--pe-safety); font-weight:var(--pe-weight); text-decoration:underline; }
.org-stamp{ margin-bottom:var(--pe-space-4); }

/* camp filter bar — search + "has a site" checkbox, above #camp-list */
.camp-filter-bar{ display:flex; align-items:stretch; gap:0; border:var(--pe-border-2); margin-bottom:var(--pe-space-4); flex-wrap:wrap; }
.camp-filter-bar .field{ flex:1 1 260px; }
.camp-filter-check{
  display:flex; align-items:center; gap:var(--pe-space-2);
  padding:var(--pe-space-3) var(--pe-space-4); cursor:pointer;
  font-size:var(--pe-text-stamp); font-weight:var(--pe-weight);
  letter-spacing:var(--pe-track-wider); text-transform:uppercase;
  white-space:nowrap;
}
/* Native checkbox chrome stripped; token-styled square box, ink check
   drawn via clip-path so it's palette-only (no image/emoji glyph). */
.camp-filter-check input[type="checkbox"]{
  appearance:none; -webkit-appearance:none; margin:0; flex:none;
  width:18px; height:18px; background:var(--pe-bone);
  border:var(--pe-border-2); border-radius:0; cursor:pointer; position:relative;
}
.camp-filter-check input[type="checkbox"]:checked{
  background:var(--pe-safety); border-color:var(--pe-ink);
}
.camp-filter-check input[type="checkbox"]:checked::after{
  content:""; position:absolute; inset:0;
  background:var(--pe-white);
  clip-path:polygon(20% 45%, 38% 63%, 78% 20%, 90% 32%, 40% 85%, 10% 55%);
}

.region-list{ display:flex; flex-direction:column; gap:var(--pe-space-4); }
.region-continent-group{ display:flex; flex-direction:column; gap:var(--pe-space-2); }
.region-continent-label{ color:var(--pe-ink-50); }
.region-chip-row{ display:flex; flex-wrap:wrap; gap:var(--pe-space-2); }
.region-chip{ border:var(--pe-border-2); background:var(--pe-bg); padding:var(--pe-space-2) var(--pe-space-3); font-size:var(--pe-text-xs); font-weight:var(--pe-weight); text-transform:uppercase; letter-spacing:var(--pe-track-tight); transform: rotate(var(--tilt,0deg)); }
.region-chip[aria-pressed="true"]{ background:var(--pe-ink); color:var(--pe-bone); }
.region-chip:hover{ background:var(--pe-safety-18); }

/* onboarding modal */
.onb-steps{ display:flex; gap:0; border:var(--pe-border-2); margin-bottom:var(--pe-space-4); }
.onb-step{ flex:1; text-align:center; padding:var(--pe-space-2) var(--pe-space-1); font-size:var(--pe-text-stamp); font-weight:var(--pe-weight); text-transform:uppercase; letter-spacing:var(--pe-track-tight); border-right:2px solid var(--pe-ink); }
.onb-step:last-child{ border-right:0; }
.onb-step.active{ background:var(--pe-ink); color:var(--pe-bone); }
.onb-step.done{ background:var(--pe-safety-18); }
.onb-panel{ display:none; }
.onb-panel.active{ display:block; }
.form-row{ display:grid; grid-template-columns:1fr 1fr; gap:var(--pe-space-3); margin-bottom:var(--pe-space-3); }
.form-field{ display:flex; flex-direction:column; gap:4px; }
.form-field.full{ grid-column:1/-1; }
.form-field label{ font-size:var(--pe-text-stamp); text-transform:uppercase; letter-spacing:var(--pe-track-wider); font-weight:var(--pe-weight); }
.form-field input, .form-field select, .form-field textarea{ border:var(--pe-border-2); padding:var(--pe-space-2) var(--pe-space-3); font-family:var(--pe-font); font-size:var(--pe-text-base); background-color:var(--pe-bone); color:var(--pe-fg); }
.form-field select{ padding-right:var(--pe-space-7); }
.form-field textarea{ resize:vertical; min-height:70px; }
.form-hint{ font-size:var(--pe-text-stamp); color:var(--pe-ink-50); }
.age-gate{ text-align:center; padding:var(--pe-space-6) var(--pe-space-4); }
.age-gate .display{ font-size:clamp(28px,5vw,48px); margin-bottom:var(--pe-space-4); }
.tier-choice{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:var(--pe-space-3); margin:var(--pe-space-4) 0; }
.tier-opt{ border:var(--pe-border-2); padding:var(--pe-space-3); cursor:pointer; }
.tier-opt input{ margin-right:6px; }
.tier-opt.selected{ background:var(--pe-safety-18); border-width:3px; }
.onb-confirm{ text-align:center; padding:var(--pe-space-6) var(--pe-space-4); }
.onb-nav{ display:flex; justify-content:space-between; margin-top:var(--pe-space-4); }
.geo-lockout{ border:var(--pe-border-2); border-style:dashed; padding:var(--pe-space-3); font-size:var(--pe-text-sm); color:var(--pe-ink-50); margin-top:4px; }

/* modal (profile + onboarding share base) */
.modal-backdrop{
  position:fixed; inset:0; z-index:1000; background:rgba(20,18,16,.72);
  display:none; align-items:flex-start; justify-content:center;
  padding:var(--pe-space-7) var(--pe-space-3); overflow-y:auto;
}
.modal-backdrop.show{ display:flex; }
.modal{
  background:var(--pe-bone); border:var(--pe-border-3); box-shadow:8px 8px 0 var(--pe-ink);
  max-width:680px; width:100%; position:relative;
}
.modal-header{ padding:var(--pe-space-5); border-bottom:var(--pe-border-3); background:var(--pe-ink); color:var(--pe-bone); }
.modal-close{
  position:absolute; top:var(--pe-space-3); right:var(--pe-space-3); width:34px; height:34px;
  background:var(--pe-safety); border:var(--pe-border-2); color:var(--pe-white); font-size:var(--pe-text-lg);
  display:grid; place-items:center; line-height:1; z-index:2;
}
.modal-id{ display:flex; align-items:center; gap:var(--pe-space-4); }
.modal-id .avatar{ background:var(--pe-bone); }
.modal-id .meta h3{ font-size:var(--pe-text-2xl); margin-bottom:2px; }
.modal-id .meta .mp{ font-size:var(--pe-text-xs); color:var(--pe-safety); }
.modal-badges{ display:flex; gap:var(--pe-space-2); flex-wrap:wrap; margin-top:var(--pe-space-3); }
.verified{ display:inline-flex; align-items:center; gap:5px; font-size:var(--pe-text-stamp); font-weight:var(--pe-weight); text-transform:uppercase; letter-spacing:var(--pe-track-tight); border:2px solid var(--pe-bone); padding:3px 9px; }
.verified.flagged{ border-color:var(--pe-safety); color:var(--pe-safety); }
.modal-body{ padding:var(--pe-space-5); }
.field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--pe-space-3) var(--pe-space-5); }
.prof-field{ border-bottom:var(--pe-divider); padding-bottom:var(--pe-space-2); }
.prof-field .flabel{ font-size:var(--pe-text-stamp); text-transform:uppercase; letter-spacing:var(--pe-track-wider); font-weight:var(--pe-weight); color:var(--pe-ink-50); margin-bottom:3px; }
.prof-field .fval{ font-size:var(--pe-text-base); }
.prof-field.full{ grid-column:1/-1; }
.geohash{ font-family:var(--pe-font); font-size:var(--pe-text-sm); background:var(--pe-safety-18); padding:2px 7px; border:2px solid var(--pe-ink); }
.modal-actions{ display:flex; gap:var(--pe-space-2); margin-top:var(--pe-space-5); padding-top:var(--pe-space-4); border-top:var(--pe-border-3); flex-wrap:wrap; }
.btn-block{ background:var(--pe-bg); color:var(--pe-fg); }
.btn-report{ background:var(--pe-safety); color:var(--pe-white); }

/* footer */
footer.site{ background:var(--pe-ink); color:var(--pe-bone); padding:var(--pe-space-5) 0; }
.foot-inner{ display:flex; justify-content:space-between; align-items:flex-start; gap:var(--pe-space-4); flex-wrap:wrap; }
.foot-inner p{ font-size:var(--pe-text-sm); max-width:560px; }
.foot-links{ display:flex; gap:var(--pe-space-4); flex-wrap:wrap; }
.foot-links a{ font-size:var(--pe-text-xs); text-transform:uppercase; letter-spacing:var(--pe-track-wide); color:var(--pe-safety); font-weight:var(--pe-weight); }
.foot-disclaimer{ font-size:var(--pe-text-xs); color:var(--pe-ink-13); margin-top:var(--pe-space-3); border-top:1px solid rgba(239,233,219,.2); padding-top:var(--pe-space-3); }

@media (max-width:860px){
  .hero-inner{ grid-template-columns:1fr; }
  .hero-l{ border-right:0; border-bottom:var(--pe-divider-3); }
  .vals-grid{ grid-template-columns:1fr; }
  .dir-controls{ grid-template-columns:1fr 1fr; }
  .field{ border-bottom:2px solid var(--pe-ink); }
  .field-grid{ grid-template-columns:1fr; }
  .form-row{ grid-template-columns:1fr; }
}
@media (max-width:520px){
  .dir-controls{ grid-template-columns:1fr; }
  .wrap{ padding:0 var(--pe-space-3); }
}
</style>
</head>

<!-- HEADER -->
<header class="site">
  <div class="nav">
    <div class="wordmark" id="brand-mark"></div>
    <nav class="navlinks" aria-label="Primary">
      <button data-nav="explore"></button>
      <button data-nav="visibility"></button>
      <button data-nav="camps"></button>
      <button data-nav="regions"></button>
    </nav>
    <button class="btn" id="btn-join-nav"></button>
  </div>
</header>

<!-- HERO -->
<section class="hero" id="home">
  <div class="hero-inner">
    <div class="hero-l">
      <div class="hero-tags">
        <span class="pe-stamp" id="stamp-1"></span>
        <span class="pe-stamp pe-stamp--alt" id="stamp-2"></span>
      </div>
      <h1 class="display" id="hero-title"></h1>
    </div>
    <div class="hero-r">
      <p class="hero-sub" id="hero-sub"></p>
      <div class="hero-actions">
        <button class="btn" id="btn-join-hero"></button>
        <a class="btn btn-outline" href="#explore" id="btn-explore-hero"></a>
      </div>
      <div class="privacy-box">
        <span class="mono-label" id="privacy-box-title"></span>
        <ul id="privacy-box-list"></ul>
      </div>
    </div>
  </div>
</section>

<!-- VALUE PROPS -->
<section class="vals">
  <div class="vals-grid" id="vals-grid"></div>
</section>

<!-- DONATE STRIP -->
<section class="donate-strip">
  <div class="donate-inner">
    <p id="donate-text"></p>
    <div>
      <a class="btn" href="#" id="donate-btn" target="_blank" rel="noopener"></a>
      <div class="form-hint" style="color:var(--pe-bone);opacity:.7;margin-top:4px;" id="donate-note"></div>
    </div>
  </div>
</section>

<!-- EXPLORE -->
<section class="section" id="explore">
  <div class="wrap">
    <div class="section-head">
      <span class="mono-label" id="explore-kicker"></span>
      <h2 id="explore-title"></h2>
      <p id="explore-body"></p>
    </div>

    <div class="tabs" role="tablist" aria-label="Explore views">
      <button class="tab" id="tab-map" role="tab" aria-selected="true" aria-controls="view-map"></button>
      <button class="tab" id="tab-dir" role="tab" aria-selected="false" aria-controls="view-dir"></button>
    </div>

    <div class="demo-banner">
      <span class="pe-stamp">Demo</span>
      <span id="demo-banner-text"></span>
    </div>

    <!-- Shared filter bar — applies to BOTH the Map and Directory views below.
         One filter state (search / region / looking-for); switching tabs
         keeps whatever is currently set. -->
    <div class="dir-controls">
      <div class="field">
        <label for="q" id="lbl-search"></label>
        <input type="text" id="q" autocomplete="off" />
      </div>
      <div class="field">
        <label for="f-continent" id="lbl-continent"></label>
        <select id="f-continent"></select>
      </div>
      <div class="field">
        <label for="f-region" id="lbl-region"></label>
        <select id="f-region"></select>
      </div>
      <div class="field">
        <label for="f-looking" id="lbl-looking"></label>
        <select id="f-looking"></select>
      </div>
    </div>

    <div id="view-map" role="tabpanel" aria-labelledby="tab-map">
      <div class="layer-toggle" role="group" aria-label="Map layers">
        <button class="layer-btn" id="layer-burners" type="button" aria-pressed="true"></button>
        <button class="layer-btn" id="layer-camps" type="button" aria-pressed="false"></button>
        <button class="layer-btn" id="layer-both" type="button" aria-pressed="false"></button>
      </div>
      <button class="layer-btn borders-toggle" id="layer-borders" type="button" aria-pressed="false"></button>
      <div class="dir-count" id="map-count"></div>
      <div id="map"></div>
    </div>

    <div id="view-dir" role="tabpanel" aria-labelledby="tab-dir" hidden>
      <div class="dir-count" id="dir-count"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
</section>

<!-- VISIBILITY -->
<section class="section" id="visibility">
  <div class="wrap">
    <div class="section-head">
      <span class="mono-label" id="vis-kicker"></span>
      <h2 id="vis-title"></h2>
      <p id="vis-body"></p>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</section>

<!-- CAMP DISCOVERY -->
<section class="section" id="camps">
  <div class="wrap">
    <div class="section-head">

  // ZIP → city lookup, baked for the demo: maps each city's zip (from
  // CITY_TABLE above) to that same city entry, so a member who enters a
  // ZIP/postal code resolves to a city-level point, never a raw ZIP-level
  // or precise coordinate. Real product would call a coarse geocoder;
  // here it's a static demo mapping over the curated cities only. Most
  // CITY_TABLE entries no longer carry a zip (members now anchor to
  // cities directly) — this map stays populated only for the handful
  // of entries that do define one.
  var ZIP_TO_CITY = {};
  Object.keys(CITY_TABLE).forEach(function (region) {
    CITY_TABLE[region].forEach(function (entry) {
      if (!entry.zip) return;
      ZIP_TO_CITY[entry.zip] = { region: region, city: entry.city, lat: entry.lat, lng: entry.lng };
    });
  });

  /* Resolve a member's coarse (~city-level) coordinates, in priority order:
     (a) explicit city string found in their region's CITY_TABLE,
     (b) explicit zip found in ZIP_TO_CITY,
     (c) region centroid from CITY.
     Never derives or returns anything more precise than a city centroid;
     the raw zip itself is only ever used as a lookup key, never rendered. */
  function resolveMemberCity(m) {
    if (m.city) {
      var list = CITY_TABLE[m.region] || [];
      for (var i = 0; i < list.length; i++) {
        if (list[i].city === m.city) return { lat: list[i].lat, lng: list[i].lng, label: list[i].city };
      }
    }
    if (m.zip && ZIP_TO_CITY[m.zip]) {
      var z = ZIP_TO_CITY[m.zip];
      return { lat: z.lat, lng: z.lng, label: z.city };
    }
    var c = CITY[m.region];
    return { lat: c.lat, lng: c.lng, label: null };
  }

  /* Deterministic per-member jitter (derived from the playa name, not
     stored) so members resolving to the same coarse point don't all
     stack on one identical pixel. ~0.04deg (~4km) — enough to visibly
     separate members sharing a city at continental zoom, still clearly
     coarse (nowhere near the old 0.6deg cloud, nowhere near a precise/
     street-level coordinate). No precise coordinate is ever stored on
     the member. Shared by map rendering. */
  function coarseJitter(pn) {
    var h = 0;
    for (var k = 0; k < pn.length; k++) { h = (h * 31 + pn.charCodeAt(k)) >>> 0; }
    return {
      lat: (((h % 2000) / 1000) - 1) * 0.04,
      lng: ((((h >>> 8) % 2000) / 1000) - 1) * 0.04
    };
  }

  function resolveMemberCoords(m) {
    // Live members carry a server-computed coarse point (already jittered
    // within a ~5km geohash cell). No client-side placement needed.
    if (m._live) return { lat: m._live.lat, lng: m._live.lng, label: m.homeCity || m.region };
    var base = resolveMemberCity(m);
    var j = coarseJitter(m.pn);
    return { lat: base.lat + j.lat, lng: base.lng + j.lng, label: base.label };
  }

     resolves, else the region name. Never shows the raw zip. */
  function approxLocationLabel(m) {
    var base = resolveMemberCity(m);
    return base.label ? (base.label + ' · ' + m.region) : m.region;
  }

  /* ============================================================
     Anchor every member (curated AND generated) to a distinct real
     city in their home region's CITY_TABLE list, via ONE shared
     per-region cursor (CITY_CURSOR / nextCityForRegion below) so the
     two assignment passes continue the same counter instead of each
     starting at index 0 — otherwise the first member of every region
     from BOTH passes lands on the same city (usually the centroid),
     which is exactly the clustering bug this fixes.

     Each region also gets a deterministic STARTING OFFSET derived from
     a hash of the region name (offset % list.length), so the very
     first member assigned in a region doesn't always land on city
     index 0 either — different regions start on different cities.
     Cursor then advances round-robin (offset + n) % list.length, so
     members fan out across the region's full city list. Fully
     deterministic/seeded — identical roster + placement every load.
     ============================================================ */
  var CITY_CURSOR = {};
  function regionStartOffset(region, listLen) {
    var h = 0;
    for (var i = 0; i < region.length; i++) { h = (h * 31 + region.charCodeAt(i)) >>> 0; }
    return h % listLen;
  }
  function nextCityForRegion(region) {
    var options = CITY_TABLE[region];
    if (!options || !options.length) return null;
    if (!(region in CITY_CURSOR)) CITY_CURSOR[region] = regionStartOffset(region, options.length);
    var choice = options[CITY_CURSOR[region] % options.length];
    CITY_CURSOR[region]++;
    return choice;
  }

  (function () {
    MEMBERS.forEach(function (m) {
      var choice = nextCityForRegion(m.region);
      if (!choice) return;
      m.city = choice.city;
    });
  })();

  /* ============================================================
     PROCEDURAL MEMBER GENERATOR — deterministic/seeded, so the
     roster is identical on every page load. Scales the curated 51
     up to ~200 total without hand-writing 150 literals. Every
     generated member uses the EXACT 20-field-aligned MEMBERS schema
     (see block comment above) and only ever references existing
     CITY region keys — never invents a region. Vocabulary for
     "looking" stays within the same set the filter UI expects
     (Rides/Camp/Collaborators/Friends).
     ============================================================ */
  (function () {
    // mulberry32 — small, fast, deterministic 32-bit PRNG.
    function mulberry32(seed) {
      var t = seed >>> 0;
      return function () {
        t |= 0; t = (t + 0x6D2B79F5) | 0;
        var r = Math.imul(t ^ (t >>> 15), 1 | t);
        r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
      };
    }
    var rand = mulberry32(0xCE2026); // fixed seed → identical roster every load

    function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }
    function pickN(arr, n) {
      var pool = arr.slice(), out = [];
      n = Math.min(n, pool.length);
      for (var i = 0; i < n; i++) {
        var idx = Math.floor(rand() * pool.length);
        out.push(pool.splice(idx, 1)[0]);
      }
      return out;
    }
    function chance(p) { return rand() < p; }
    function intRange(min, max) { return min + Math.floor(rand() * (max - min + 1)); }

    /* Weighted region pool — major, well-known Burner scenes (per CLAUDE.md
       task spec) get proportionally more generated members than smaller
       regions, while every region in REGION_NAMES still gets picked at
       least once per weight-1 slot. Built once from REGION_NAMES so it
       always tracks the live region set (no hardcoded region list to
       fall out of sync). */
    var MAJOR_REGION_WEIGHT = {
      "San Francisco Bay Area": 7, "Los Angeles": 6, "Berlin": 6, "London UK": 6,
      "New York City": 6, "Melbourne": 5, "Cape Town (AfrikaBurn)": 5,
      "São Paulo": 5, "Tel Aviv": 5, "Sydney": 5, "Reno / Tahoe": 4,
      "Seattle": 4, "Portland": 4, "Denver / Boulder": 4, "Austin": 4,
      "Chicago": 4, "Mexico City": 4, "Vancouver BC": 4, "Auckland (Kiwiburn)": 4,
      "Amsterdam": 3, "Paris": 3, "Toronto": 3, "Miami": 3, "Barcelona": 3,
      "Tokyo": 3, "Bali": 3, "Buenos Aires": 3, "Bangkok": 3, "Johannesburg": 3
    };
    var REGION_WEIGHTED_POOL = [];
    REGION_NAMES.forEach(function (r) {
      var w = MAJOR_REGION_WEIGHT[r] || 1;
      for (var wi = 0; wi < w; wi++) REGION_WEIGHTED_POOL.push(r);
    });

    var ADJ = ["Dusty","Neon","Feral","Velvet","Rusty","Molten","Quiet","Wandering","Electric","Salty",
      "Glimmering","Sunburnt","Nocturnal","Radiant","Scrappy","Windswept","Luminous","Grizzled","Cosmic","Barefoot",
      "Ashen","Prismatic","Wily","Static","Feathered","Iron","Amber","Frosted","Tangled","Wild"];
    var NOUN = ["Lark","Coyote","Comet","Wren","Badger","Ferret","Sparrow","Jackal","Otter","Falcon",
      "Cactus","Tumbleweed","Mirage","Ember","Antler","Puddle","Compass","Lantern","Marmot","Heron",
      "Dune","Thistle","Raven","Pelican","Magpie","Yucca","Vulture","Owlet","Prairie","Satellite"];
    var DEFAULT_NAMES = ["Alex Nguyen","Jamie Ortiz","Sam Kowalski","Riley Blackwood","Morgan Achebe",
      "Casey Lindqvist","Taylor Mbeki","Jordan Vasquez","Drew Kapoor","Robin Fairweather",
      "Skyler Dumont","Avery Nakamura","Quinn O'Sullivan","Reese Andersson","Finley Osei"];
    var PRONOUNS = ["he/him","she/her","they/them","he/they","she/they"];
    var AVATAR_EMOJI = ["🌵","⚡","🔥","🌻","✨","🦊","🌊","🌾","🐍","🎨","🪶","🌙","🛰️","🧭","🪨","🌴","🐺","🍄","🛞","🔧"];
    function initials(pn) { return pn.slice(0, 2).toUpperCase(); }

    var BIO_TEMPLATES = [
      "Active build-night regular out of {region}, hands in every project going.",
      "Regional meetup regular in {region}, mostly here for the people between burns.",
      "First-timer finding their footing in the regional network out of {region}.",
      "Long-time Burner who put down roots in the {region} community and never looked back.",
      "Splits time between local regional meetups and the annual pilgrimage — based in {region}.",
      "Camp-less by choice, community by default — {region}'s unofficial welcome committee.",
      "Keeps the {region} regional group chat alive at 2am with gear questions.",
      "Newcomer-curious, veteran-adjacent — soaking up the {region} scene before committing to anything.",
      "Runs a small gifting circle out of {region} between burns.",
      "Shows up for every {region} decompression and calls it a lifestyle, not an event.",
      "Prefers the low-key regional scene in {region} to the deep-playa chaos, most years.",
      "Building a home base for wayward Burners in {region}, one potluck at a time."
    ];
    var SKILLS = ["Shade rigging","Solar power","Carpentry","LED wiring","Electrical","Sound design",
      "Cooking","Logistics","Ride coordination","Sewing","Welding","First aid","Yoga instruction",
      "Photography","Graphic design","Bike mechanics","Herbalism","Fabrication","Translation",
      "Event hosting","Fire performance","Community organizing","Woodworking","Videography","Radio"];
    var INTERESTS = ["Desert ecology","Kinetic sculpture","Synthwave","Permaculture","Deep house",
      "Astrophotography","Fermentation","Regional cuisine","Fire safety","Cycling","Textile history",
      "Amateur radio","Foraging","Mutual aid","Techno","Bioluminescence","Print culture","Board games",
      "Native flora","Field recording"];
    var PROJECTS = ["A modular shade kit","A reactive LED tunnel","The regional zine","A traveling potluck series",
      "An off-grid comms net","A community songbook","A gifting economy toolkit","A build-log podcast",
      "A regional welcome guide","A collaborative art wall","A camp-kitchen recipe archive","A bike prep kit"];
    var LOOKING_POOL = ["Rides","Camp","Collaborators","Friends"];
    var LANGS = ["English","Spanish","French","German","Portuguese","Mandarin","Hebrew","Dutch","Indonesian","Arabic"];
    var AVAIL = ["Not hosting", "Not hosting yet", "Can host 1", "Can host 2", "Hosting monthly meetups",
      "Available for consults", "Hosting potlucks locally"];
    var REGIONAL_EVENTS = ["Decompression","Precompression","Regional Meetup","Build Night","Potluck Circle","Welcome Social"];
    var CAMPS_POOL = ["", "", "", "Satellite Crew", "Dustlight Collective", "The Wayfinders",
      "Loose Ends Camp", "Afterglow", "The Longform", "Camp Contact", "Signal Loss", "Green Playa"];
    var ROLES_POOL = ["Logistics","Community Lead","Build Crew","Newcomer Liaison","Fabrication","Media","Hospitality"];
    var CONTACT_POOL = ["In-app message","Email after intro"];

    function generateMembers(n) {
      var out = [];
      var usedNames = {};
      MEMBERS.forEach(function (m) { usedNames[m.pn] = true; });
      // City assignment uses the SHARED CITY_CURSOR (via nextCityForRegion,
      // defined above with the curated-member assignment) so generated
      // members continue the same per-region counter the curated pass left
      // off at, instead of restarting at city index 0 — see the comment on
      // CITY_CURSOR above for why that matters.

      for (var i = 0; i < n; i++) {
        // Region pick: first guarantee coverage by cycling once through
        // every region in REGION_NAMES (so even the smallest region gets at
        // least one generated member), then fill the remainder from the
        // weighted pool so major scenes (SF, LA, Berlin, London, NYC,
        // Melbourne, Cape Town, São Paulo, Tel Aviv, etc.) get proportionally
        // more members. A little cross-scatter keeps the mix from feeling
        // too mechanical.
        var region = i < REGION_NAMES.length ? REGION_NAMES[i] : pick(REGION_WEIGHTED_POOL);
        if (chance(0.3)) region = pick(REGION_WEIGHTED_POOL); // add some cross-scatter

        var pn = pick(ADJ) + " " + pick(NOUN);
        var guard = 0;
        while (usedNames[pn] && guard < 20) {
          pn = pick(ADJ) + " " + pick(NOUN) + " " + intRange(2, 999);
          guard++;
        }
        usedNames[pn] = true;

        var hasDn = chance(0.55);
        var dn = hasDn ? pick(DEFAULT_NAMES) : "";
        var pronouns = pick(PRONOUNS);
        var avatar = chance(0.6) ? pick(AVATAR_EMOJI) : initials(pn);

        var years = intRange(0, 15);
        var burns = Math.min(intRange(0, 14), years + intRange(0, 2));

        var hasCamp = chance(0.4);
        var camp = hasCamp ? pick(CAMPS_POOL.filter(function (c) { return c; })) : "";
        var role = camp ? pick(ROLES_POOL) : "";

        var bio = pick(BIO_TEMPLATES).replace("{region}", region);

        var looking = pickN(LOOKING_POOL, intRange(1, 3));
        var regionalCount = intRange(0, 2);
        var regional = [];
        for (var j = 0; j < regionalCount; j++) {
          regional.push(region.split(" ")[0].split("/")[0].trim() + " " + pick(REGIONAL_EVENTS));
        }

        var verifiedRoll = rand();
        var verified = verifiedRoll < 0.6 ? "verified" : (verifiedRoll < 0.9 ? "unverified" : "flagged");
        var visRoll = rand();
        var vis = visRoll < 0.75 ? "beacon" : "ghost";

        // Coarse-location anchor for field 6 ("Approximate location") —
        // every generated member is anchored to a real, distinct city in
        // their region's (now much larger) CITY_TABLE list, via the SAME
        // shared CITY_CURSOR the curated members used above (continuing
        // its count, with its per-region hashed starting offset already
        // applied), so members cycle evenly across all of that region's
        // cities rather than clustering on the first few. No blank/
        // region-only members are generated anymore — city anchoring is
        // now unconditional wherever the region has a city list (all
        // regions do).
        var city = undefined;
        var cityChoice = nextCityForRegion(region);
        if (cityChoice) city = cityChoice.city;

        var member = {
          pn: pn,
          dn: dn,
          pronouns: pronouns,
          avatar: avatar,
          region: region,
          bio: bio,
          years: years,
          burns: burns,
          camp: camp,
          role: role,
          skills: pickN(SKILLS, intRange(1, 3)),
          interests: pickN(INTERESTS, intRange(1, 3)),
          projects: chance(0.7) ? pickN(PROJECTS, intRange(1, 2)) : [],
          looking: looking,
          langs: pickN(LANGS, intRange(1, 2)).concat(["English"]).filter(function (v, idx, arr) { return arr.indexOf(v) === idx; }).slice(0, 3),
          avail: pick(AVAIL),
          regional: regional,
          contact: pick(CONTACT_POOL),
          verified: verified,
          vis: vis
        };
        if (city) member.city = city;

        out.push(member);
      }
      return out;
    }

    // Bring curated (51) + generated up to ~200 total.
    MEMBERS = MEMBERS.concat(generateMembers(149));
  })();

  /* ============================================================
     LIVE HYDRATION — in live mode, replace the demo MEMBERS/CAMPS
     arrays with real data from the API before anything renders.
     Function declaration is hoisted; the await below runs before all
     top-level renders, so every view reflects live data.
     ============================================================ */
  async function getJSON(url) {
    // Bounded so a slow/unreachable API can't leave the page blank — hydration
    // fails soft and the views render empty rather than hanging.
    var res = await fetch(url, {
      credentials: 'same-origin', headers: { Accept: 'application/json' },
      signal: AbortSignal.timeout(6000),
    });
    if (!res.ok) throw new Error(url + ' -> ' + res.status);
    return res.json();
  }
  function apiMemberToDemo(p, coords) {
    return {
      pn: p.pn, dn: p.dn || '', pronouns: p.pronouns || '', avatar: p.avatar || '',
      region: p.region || '', bio: p.bio || '', years: p.years || 0, burns: p.burns || 0,
      camp: p.camp || '', role: p.role || '', skills: p.skills || [], interests: p.interests || [],
      projects: p.projects || [], looking: p.looking || [], langs: p.langs || [],
      avail: p.avail || '', regional: p.regional || [],
      contact: p.contactPref === 'email_after_intro' ? 'Email after intro' : 'In-app message',
      verified: p.verified || 'unverified', vis: 'beacon',
      city: p.homeCity || '', geo: p.geo || '', _id: p.id, _live: coords || null,
    };
  }
  async function hydrateLive() {
    // Coarse map points keyed by profile id.
    var coordsById = {};
    try {
      var mapData = await getJSON('/api/map');
      (mapData.points || []).forEach(function (pt) { coordsById[pt.id] = { lat: pt.lat, lng: pt.lng }; });
    } catch (e) { /* map optional */ }

    // All Searchable members (paginate through the directory).
    var members = [];
    try {
      for (var page = 1; page <= 100; page++) {
        var d = await getJSON('/api/directory?page=' + page);
        (d.results || []).forEach(function (p) { members.push(apiMemberToDemo(p, coordsById[p.id])); });
        if (!d.results || d.results.length < d.pageSize) break;
      }
    } catch (e) { /* leave empty on failure */ }
    MEMBERS.length = 0; Array.prototype.push.apply(MEMBERS, members);

    // Camps.
    try {
      var c = await getJSON('/api/camps');
      var camps = (c.camps || []).map(function (x) {
        return { name: x.name, region: x.region || '', url: x.url || '', desc: x.description || '' };
      });
      CAMPS.length = 0; Array.prototype.push.apply(CAMPS, camps);
    } catch (e) { CAMPS.length = 0; }

    // Retune the banner copy for live data.
    S.demoDataNote = 'Live pilot — every profile below is a real member who chose to be Searchable. Approximate locations are coarse (~5km), never exact.';
  }

  // Current signed-in state, used by the Join / onboarding flow.
  var ME = { user: null, profile: null };
  async function loadMe() {
    try { ME = await getJSON('/api/me'); } catch (e) { ME = { user: null, profile: null }; }
  }

  // Runtime config (donation link, admin flag) from the server.
  var DONATE_HREF = '#';
  var IS_ADMIN = false;
  async function loadConfig() {
    try {
      var cfg = await getJSON('/api/config');
      if (cfg && cfg.donateUrl) { DONATE_HREF = cfg.donateUrl; S.donateNote = 'External link · voluntary'; }
      IS_ADMIN = !!(cfg && cfg.isAdmin);
    } catch (e) { /* config optional */ }
  }

  if (LIVE) { await hydrateLive(); }
  await loadMe();
  await loadConfig();

  /* Deterministic per-camp jitter (derived from the camp name, same
     technique as coarseJitter for members) so camps sharing a hometown
     don't stack on one identical pixel. Still coarse — no precise
     coordinate is ever derived or stored. */
  function campJitter(name) {
    var h = 0;
    for (var k = 0; k < name.length; k++) { h = (h * 31 + name.charCodeAt(k)) >>> 0; }
    return {
      lat: (((h % 2000) / 1000) - 1) * 0.015,
      lng: ((((h >>> 8) % 2000) / 1000) - 1) * 0.015
    };
  }

  // resolveCampCoords(camp) — case/trim-tolerant CAMP_GEO lookup +
  // deterministic coarse jitter. Returns null (never guesses into the
  // ocean) when the hometown isn't in CAMP_GEO.
  function resolveCampCoords(camp) {
    if (!camp || !camp.region) return null;
    var key = camp.region.trim();
    var base = CAMP_GEO[key];
    if (!base) {
      var lower = key.toLowerCase();
      var found = Object.keys(CAMP_GEO).filter(function(k){ return k.toLowerCase() === lower; });
      base = found.length ? CAMP_GEO[found[0]] : null;
    }
    if (!base) return null;
    var j = campJitter(camp.name);
    return { lat: base.lat + j.lat, lng: base.lng + j.lng };
  }

  /* ============================================================
     CUSTOM SELECT ENHANCEMENT
     Native <select> elements render an unstyleable OS option list when
     opened (dark, rounded — clashes with the brutalist theme). This
     replaces the OPEN list only: the native <select> stays in the DOM,
     hidden but still the source of truth for .value/change/input, while
     a token-styled trigger + listbox panel render on top of it.
     enhanceSelect() is idempotent — safe to call repeatedly (e.g. every
     time the onboarding form is rebuilt) without double-wrapping.
     ============================================================ */
  function enhanceSelect(selectEl){
    if (!selectEl || selectEl.tagName !== 'SELECT') return;
    if (selectEl.dataset.peEnhanced === '1') { syncTriggerLabel(selectEl); return; }
    selectEl.dataset.peEnhanced = '1';

    var wrap = document.createElement('div');
    wrap.className = 'pe-select-wrap';
    selectEl.parentNode.insertBefore(wrap, selectEl);
    wrap.appendChild(selectEl);
    selectEl.classList.add('pe-select-native', 'pe-select-hidden');
    selectEl.setAttribute('tabindex', '-1');
    selectEl.setAttribute('aria-hidden', 'true');

    var triggerId = (selectEl.id || 'pe-sel') + '-trigger';
    var panelId = (selectEl.id || 'pe-sel') + '-panel';

    var trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'pe-select-trigger';
    trigger.id = triggerId;
    trigger.setAttribute('role', 'combobox');
    trigger.setAttribute('aria-haspopup', 'listbox');
    trigger.setAttribute('aria-expanded', 'false');
    trigger.setAttribute('aria-controls', panelId);

    // Associate with the existing <label for="selectId"> so the current
    // labels keep labelling the control (label click focuses the trigger
    // via its "for", and aria-labelledby covers the accessible name).
    var assocLabel = selectEl.id ? document.querySelector('label[for="' + selectEl.id + '"]') : null;
    if (assocLabel) {
      if (!assocLabel.id) assocLabel.id = selectEl.id + '-label-auto';
      trigger.setAttribute('aria-labelledby', assocLabel.id + ' ' + triggerId);
      // Clicking the original label should open/focus the custom trigger
      // instead of doing nothing (native "for" can't target a button the
      // same way it targets form controls in every browser).
      assocLabel.addEventListener('click', function(e){ e.preventDefault(); trigger.focus(); });
    }

    var labelSpan = document.createElement('span');
    labelSpan.className = 'pe-trigger-label';
    var caretSpan = document.createElement('span');
    caretSpan.className = 'pe-caret';
    caretSpan.setAttribute('aria-hidden', 'true');
    trigger.appendChild(labelSpan);
    trigger.appendChild(caretSpan);

    var panel = document.createElement('div');
    panel.className = 'pe-select-panel';
    panel.id = panelId;
    panel.setAttribute('role', 'listbox');
    if (assocLabel) panel.setAttribute('aria-labelledby', assocLabel.id);

    wrap.appendChild(trigger);
    wrap.appendChild(panel);

    var activeIndex = -1;

    function options(){ return Array.prototype.slice.call(selectEl.options); }

    function renderLabel(){
      var opt = selectEl.options[selectEl.selectedIndex];
      labelSpan.textContent = opt ? opt.textContent : '';
    }

    function renderPanel(){
      panel.innerHTML = '';
      options().forEach(function(opt, i){
        var row = document.createElement('div');
        row.className = 'pe-select-option';
        row.setAttribute('role', 'option');
        row.dataset.index = String(i);
        var selected = i === selectEl.selectedIndex;
        row.setAttribute('aria-selected', selected ? 'true' : 'false');
        if (selected) { row.classList.add('pe-option-selected'); activeIndex = i; }
        row.textContent = opt.textContent;
        row.addEventListener('mouseenter', function(){ setActive(i, false); });
        row.addEventListener('click', function(){ choose(i); });
        panel.appendChild(row);
      });
    }

    function setActive(i, scroll){
      var rows = panel.querySelectorAll('.pe-select-option');
      if (!rows.length) return;
      if (i < 0) i = 0;
      if (i > rows.length - 1) i = rows.length - 1;
      activeIndex = i;
      rows.forEach(function(r, idx){ r.classList.toggle('pe-option-active', idx === i); });
      trigger.setAttribute('aria-activedescendant', rows[i].id || '');
      if (scroll !== false && rows[i].scrollIntoView) rows[i].scrollIntoView({ block: 'nearest' });
    }

    function choose(i){
      var opt = selectEl.options[i];
      if (!opt) return;
      selectEl.value = opt.value;
      renderLabel();
      selectEl.dispatchEvent(new Event('change', { bubbles: true }));
      selectEl.dispatchEvent(new Event('input', { bubbles: true }));
      closePanel();
      trigger.focus();
    }

    function openPanel(){
      renderPanel();
      panel.classList.add('open');
      trigger.setAttribute('aria-expanded', 'true');
      setActive(selectEl.selectedIndex, true);
      document.addEventListener('mousedown', onDocMouseDown, true);
    }
    function closePanel(){
      panel.classList.remove('open');
      trigger.setAttribute('aria-expanded', 'false');
      trigger.removeAttribute('aria-activedescendant');
      document.removeEventListener('mousedown', onDocMouseDown, true);
    }
    function isOpen(){ return panel.classList.contains('open'); }
    function onDocMouseDown(e){
      if (!wrap.contains(e.target)) closePanel();
    }

    trigger.addEventListener('click', function(){
      if (isOpen()) closePanel(); else openPanel();
    });

    trigger.addEventListener('keydown', function(e){
      switch (e.key) {
        case 'ArrowDown':
          e.preventDefault();
          if (!isOpen()) { openPanel(); } else { setActive(activeIndex + 1); }
          break;
        case 'ArrowUp':
          e.preventDefault();
          if (!isOpen()) { openPanel(); } else { setActive(activeIndex - 1); }
          break;
        case 'Home':
          if (isOpen()) { e.preventDefault(); setActive(0); }
          break;
        case 'End':
          if (isOpen()) { e.preventDefault(); setActive(options().length - 1); }
          break;
        case 'Enter':
        case ' ':
          e.preventDefault();
          if (isOpen()) choose(activeIndex); else openPanel();
          break;
        case 'Escape':
          if (isOpen()) { e.preventDefault(); closePanel(); trigger.focus(); }
          break;
        case 'Tab':
          closePanel();
          break;
        default:
          // Type-ahead: jump to the first option starting with the typed letter.
          if (e.key.length === 1 && /[a-z0-9]/i.test(e.key)) {
            var letter = e.key.toLowerCase();
            var opts = options();
            for (var n = 1; n <= opts.length; n++) {
              var idx = (activeIndex + n) % opts.length;
              if (opts[idx].textContent.trim().toLowerCase().indexOf(letter) === 0) {
                if (!isOpen()) openPanel();
                setActive(idx);
                break;
              }
            }
          }
      }
    });

    // Keep the trigger label in sync if code elsewhere sets select.value
    // and dispatches 'change' (e.g. region-browse filter sync).
    selectEl.addEventListener('change', renderLabel);

    // Stash refresh hooks on the wrapper so refreshSelect() (called after
    // code elsewhere repopulates selectEl's <option>s, e.g. the continent
    // cascade) can rebuild the trigger label and, if open, the panel too —
    // without re-wrapping the DOM or losing this closure's state.
    wrap._peRefresh = function () {
      renderLabel();
      if (isOpen()) renderPanel();
    };

    renderLabel();
  }

  // refreshSelect(selectEl) — call after repopulating a select's <option>s
  // in place (e.g. the continent → region cascade) so the custom trigger
  // label and, if the panel happens to be open, the listbox itself reflect
  // the new option set. No-op / falls back to enhancing if the select was
  // never enhanced yet.
  function refreshSelect(selectEl){
    if (!selectEl) return;
    var wrap = selectEl.closest('.pe-select-wrap');
    if (!wrap || !wrap._peRefresh) { enhanceSelect(selectEl); return; }
    wrap._peRefresh();
  }

  function syncTriggerLabel(selectEl){
    var wrap = selectEl.closest('.pe-select-wrap');
    if (!wrap) return;
    var labelSpan = wrap.querySelector('.pe-trigger-label');
    var opt = selectEl.options[selectEl.selectedIndex];
    if (labelSpan) labelSpan.textContent = opt ? opt.textContent : '';
  }

  function enhanceAllSelects(root){
    var scope = root || document;
    scope.querySelectorAll('select').forEach(function(sel){ enhanceSelect(sel); });
  }

     Guarded: if Leaflet fails to load (offline / CDN blocked), the
     map is skipped and a fallback notice is shown, but the rest of
     the script — including the zine-tilt pass — still runs.
     ============================================================ */
  var map = null;
  try {
    if (typeof L === 'undefined') throw new Error('Leaflet unavailable');
    map = L.map('map', { worldCopyJump:true, minZoom:2 }).setView([20,10], 2);
    // Basemap follows the site's selected language. Free raster tile providers
    // don't offer arbitrary per-language place labels, so English uses an
    // English-labelled (Esri light-gray) basemap. Other languages can be slotted
    // into MAP_TILES with a language-capable provider; falls back to English.
    var siteLang = ((document.documentElement.getAttribute('lang')) || 'en').slice(0,2).toLowerCase();
    var esriBase = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}';
    var esriRef  = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}';
    var esriAttr = 'Tiles &copy; Esri — Esri, HERE, Garmin, &copy; OpenStreetMap contributors';
    var MAP_TILES = {
      en: [
        { url: esriBase, opts: { attribution: esriAttr, maxZoom: 19, maxNativeZoom: 16 } },
        { url: esriRef,  opts: { maxZoom: 19, maxNativeZoom: 16 } }
      ]
    };
    (MAP_TILES[siteLang] || MAP_TILES.en).forEach(function(t){ L.tileLayer(t.url, t.opts).addTo(map); });
  } catch (err) {
    var mapEl = byId('map');
    if (mapEl) {
      mapEl.innerHTML = '<div style="padding:var(--pe-space-5); border:var(--pe-border-2); ' +
        'font-weight:var(--pe-weight); text-transform:uppercase; letter-spacing:var(--pe-track-tight);">' +
        'Map basemap needs a network connection. Directory works offline.</div>';
    }
