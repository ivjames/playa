<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Playa.Earth · Moderation</title>
<style>
  :root{ --bone:#efe9db; --ink:#141210; --safety:#ff5714; --white:#fff; --font:'Courier New',ui-monospace,Menlo,monospace; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bone); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.5; padding:24px; }
  .wrap{ max-width:900px; margin:0 auto; }
  h1{ text-transform:uppercase; letter-spacing:.04em; border:3px solid var(--ink); background:var(--ink); color:var(--bone); display:inline-block; padding:8px 12px; margin-bottom:20px; }
  h2{ text-transform:uppercase; font-size:16px; margin:20px 0 8px; }
  .card{ border:2px solid var(--ink); box-shadow:4px 4px 0 var(--ink); background:var(--bone); padding:16px; margin-bottom:16px; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input,button{ font-family:inherit; font-size:14px; }
  input[type=email]{ border:2px solid var(--ink); padding:8px; min-width:260px; }
  button{ border:2px solid var(--ink); background:var(--safety); color:var(--white); font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:8px 14px; cursor:pointer; box-shadow:3px 3px 0 var(--ink); }
  button.ghost{ background:transparent; color:var(--ink); box-shadow:none; }
  button:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .tag{ display:inline-block; border:2px solid var(--safety); color:var(--safety); font-size:11px; text-transform:uppercase; letter-spacing:.1em; padding:2px 7px; }
  .muted{ color:rgba(20,18,16,.6); font-size:13px; }
  .reasons{ margin-top:8px; font-size:13px; }
  .reasons li{ list-style:none; border-left:3px solid var(--safety); padding-left:8px; margin:4px 0; }
  #status{ min-height:1.2em; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Playa.Earth · Moderation</h1>
  <div id="auth" class="card" style="display:none;">
    <h2>Sign in</h2>
    <p class="muted">Enter an admin email; we'll send a one-tap link. After clicking it, return to this page.</p>
    <div class="row" style="margin-top:12px;">
      <input type="email" id="email" placeholder="admin@example.com" autocomplete="email" />
      <button id="send">Send sign-in link</button>
    </div>
    <div id="status" class="muted"></div>
  </div>

  <div id="panel" style="display:none;">
    <div class="row"><span class="tag">Admin</span><span class="muted" id="who"></span> <button class="ghost" id="refresh">Refresh</button> <button class="ghost" id="logout">Log out</button></div>
    <h2>Reported members</h2>
    <div id="reports"></div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  async function api(url, opts){
    var res = await fetch(url, Object.assign({ credentials:'same-origin', headers:{'Content-Type':'application/json'} }, opts||{}));
    var body = await res.json().catch(function(){ return {}; });
    return { ok:res.ok, status:res.status, body:body };
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  async function boot(){
    var cfg = await api('/api/config');
    if (cfg.body && cfg.body.isAdmin){ $('panel').style.display='block'; $('auth').style.display='none'; loadReports(); }
    else { $('auth').style.display='block'; $('panel').style.display='none'; }
  }

  $('send').addEventListener('click', async function(){
    var email = $('email').value.trim();
    if (!email){ $('status').textContent='Enter your email.'; return; }
    $('status').textContent='Sending…';
    var r = await api('/api/auth/request', { method:'POST', body: JSON.stringify({ email: email }) });
    if (!r.ok){ $('status').textContent = r.body.error || 'Error.'; return; }
    $('status').innerHTML = 'Check your email for a link.' + (r.body.devLink ? ' <a href="'+esc(r.body.devLink)+'">[dev link]</a>' : '');
  });
  $('logout').addEventListener('click', async function(){ await api('/api/auth/logout', { method:'POST' }); boot(); });
  $('refresh').addEventListener('click', loadReports);

  async function loadReports(){
    var r = await api('/api/admin/reports');
    if (!r.ok){ $('reports').innerHTML = '<p class="muted">'+esc(r.body.error||'error')+'</p>'; return; }
    var targets = r.body.targets || [];
    if (!targets.length){ $('reports').innerHTML = '<p class="muted">No reports. Quiet on the playa.</p>'; return; }
    $('reports').innerHTML = targets.map(function(t){
      var p = t.profile;
      return '<div class="card" data-id="'+esc(p.id)+'">' +
        '<div class="row"><strong>'+esc(p.pn||'(unknown)')+'</strong>' +
        '<span class="tag">'+esc(t.count)+' report'+(t.count>1?'s':'')+'</span>' +
        '<span class="muted">'+esc(p.verified||'')+'</span></div>' +
        '<ul class="reasons">'+ t.reports.map(function(x){ return '<li>'+esc(x.reason||'(no reason)')+'</li>'; }).join('') +'</ul>' +
        '<div class="row" style="margin-top:10px;">' +
          '<button data-act="flag">Flag</button>' +
          '<button class="ghost" data-act="unverified">Clear flag</button>' +
          '<button class="ghost" data-act="remove">Remove account</button>' +
        '</div></div>';
    }).join('');
    [].forEach.call(document.querySelectorAll('[data-act]'), function(btn){
      btn.addEventListener('click', async function(){
        var card = btn.closest('[data-id]'); var id = card.getAttribute('data-id'); var act = btn.getAttribute('data-act');
        if (act==='remove'){ if(!confirm('Permanently remove this account?')) return; await api('/api/admin/remove', { method:'POST', body: JSON.stringify({ profileId:id }) }); }
        else { await api('/api/admin/flag', { method:'POST', body: JSON.stringify({ profileId:id, verified: act==='flag'?'flagged':'unverified' }) }); }
        loadReports();
      });
    });
  }

  boot();
})();
</script>
</body>
</html>
